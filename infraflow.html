17,418\">\n<td>WebSocket over polling</td>\n<td>Real-time log streaming</td>\n<td>Better UX for long-running tasks</td>\n</tr>\n<tr data-lines=\"418,419\">\n<td>OAuth over basic auth</td>\n<td>Industry standard, secure, no password management</td>\n<td>Seamless GitHub/GitLab integration</td>\n</tr>\n<tr data-lines=\"419,420\">\n<td>PostgreSQL over SQLite</td>\n<td>Production-grade, concurrent access</td>\n<td>Scalable data persistence</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"lines":"409,420"}}],"payload":{"lines":"407,408"}},{"content":"Future Roadmap","children":[{"content":"<svg width=\"16\" height=\"16\" viewBox=\"0 -3 24 24\"><path fill-rule=\"evenodd\" d=\"M6 5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-5z\" clip-rule=\"evenodd\"></path></svg> Editor YAML inline con validazione in tempo reale","children":[],"payload":{"lines":"423,424"}},{"content":"<svg width=\"16\" height=\"16\" viewBox=\"0 -3 24 24\"><path fill-rule=\"evenodd\" d=\"M6 5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-5z\" clip-rule=\"evenodd\"></path></svg> Upload file <code>.yml</code> / <code>.tf</code> via drag-and-drop","children":[],"payload":{"lines":"424,425"}},{"content":"<svg width=\"16\" height=\"16\" viewBox=\"0 -3 24 24\"><path fill-rule=\"evenodd\" d=\"M6 5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-5z\" clip-rule=\"evenodd\"></path></svg> Gestione variabili dinamiche da UI","children":[],"payload":{"lines":"425,426"}},{"content":"<svg width=\"16\" height=\"16\" viewBox=\"0 -3 24 24\"><path fill-rule=\"evenodd\" d=\"M6 5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM3 6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-5z\" clip-rule=\"evenodd\"></path></svg> Crono

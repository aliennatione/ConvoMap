-built_in\">str</span></span>):\n    queue = get_log_queue(task_id)\n    <span class=\"hljs-comment\"># Init</span>\n    process_init = subprocess.Popen(\n        [<span class=\"hljs-string\">\"tofu\"</span>, <span class=\"hljs-string\">\"init\"</span>], cwd=project_path,\n        stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=<span class=\"hljs-literal\">True</span>, bufsize=<span class=\"hljs-number\">1</span>,\n    )\n    <span class=\"hljs-keyword\">for</span> line <span class=\"hljs-keyword\">in</span> process_init.stdout:\n        queue.put_nowait(<span class=\"hljs-string\">f\"[init] <span class=\"hljs-subst\">{line.strip()}</span>\"</span>)\n    process_init.wait()\n    <span class=\"hljs-comment\"># Apply</span>\n    process_apply = subprocess.Popen(\n        [<span class=\"hljs-string\">\"tofu\"</span>, <span class=\"hljs-string\">\"apply\"</span>, <span class=\"hljs-string\">\"-auto-approve\"</span>], cwd=project_path,\n        stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=<span class=\"hljs-literal\">True</span>, bufsize=<span class=\"hljs-number\">1</span>,\n    )\n    <span class=\"hljs-keyword\">for</span> line <span class=\"hljs-keyword\">in</span> process_apply.stdout:\n        queue.put_nowait(<span class=\"hljs-string\">f\"[apply] <span class=\"hljs-subst\">{line.strip()}</span>\"</span>)\n    process_apply.wait()\n    queue.put_nowait(<span class=\"hljs-string\">f\"[exit] code: <span class=\"hljs-subst\">{process_apply.returncode}</span>\"</span>)\n</code></pre>","children":[]}],"payload":{"lines":"175,176"}},{"content":"WebSocket per log realtime","children":[{"content":"<pre><code class=\"language-python\"><span class=\"hljs-meta\">@router.websocket(<span class=\"hljs-params\"><span class=\"hljs-string\">\"/ws/logs/{task_id}\"</span></span>)</span>\n<span class=\"hljs-keyword\">async</span> <span class=\"hljs-keyword\">def</span> <span class=\"hljs-title function_\">websocket_log_stream</span>(<span class=\"hljs-params\">websoc

            })(() => window.markmap,null,{"content":"<pre><code class=\"language-markdown\"><span class=\"hljs-section\"># tgfeed-security-enhancer: Advanced Multi-language Security Scan Workflow</span>\n\n<span class=\"hljs-section\">## Project Overview</span>\n<span class=\"hljs-bullet\">-</span> Goals: Integrated security scanning for multi-language repositories, identifying vulnerabilities, bad practices, and sensitive data.\n<span class=\"hljs-bullet\">-</span> Context &amp; Purpose: Essential for DevSecOps, automating security checks on projects like <span class=\"hljs-code\">`tgfeed`</span>.\n<span class=\"hljs-bullet\">-</span> Key Features\n<span class=\"hljs-bullet\">  -</span> Automated &amp; scheduled GitHub Actions workflow\n<span class=\"hljs-bullet\">  -</span> Custom Semgrep rules for specific risks\n<span class=\"hljs-bullet\">  -</span> Integration with multiple scanners: CodeQL, Bandit, PHPStan, ShellCheck, Ripgrep\n<span class=\"hljs-bullet\">  -</span> Aggregated reports as GitHub Actions artifacts\n<span class=\"hljs-bullet\">  -</span> Parametrizable workflow for branches/tags\n<span class=\"hljs-bullet\">-</span> Technologies Used\n<span class=\"hljs-bullet\">  -</span> GitHub Actions\n<span class=\"hljs-bullet\">  -</span> CodeQL\n<span class=\"hljs-bullet\">  -</span> Semgrep\n<span class=\"hljs-bullet\">  -</span> Bandit (Python)\n<span class=\"hljs-bullet\">  -</span> PHPStan (PHP)\n<span class=\"hljs-bullet\">  -</span> ShellCheck (Bash)\n<span class=\"hljs-bullet\">  -</span> Ripgrep\n\n<span class=\"hljs-section\">## Project Structure</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`tgfeed-security-enhancer/`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`.github/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`workflows/`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`security-scan.yml`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`patches/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`add-security-scan.patch`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`semgrep-rules/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`hardcoded-secrets.yaml`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`dangerous-functions.yaml`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`logging-sensitive-data.yaml`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`README.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`security-reports/`</span> (Generated by workflow)\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`tools/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`extract_reports.py`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`README.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`.gitignore`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`LICENSE`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`README.md`</span>\n\n<span class=\"hljs-section\">## GitHub Actions Workflow (`.github/workflows/security-scan.yml`)</span>\n<span class=\"hljs-bullet\">-</span> Name: <span class=\"hljs-code\">`Security Scan Multi-language Advanced`</span>\n<span class=\"hljs-bullet\">-</span> Triggers (<span class=\"hljs-code\">`on:`</span>)\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`push`</span>: branches <span class=\"hljs-code\">`main`</span>, <span class=\"hljs-code\">`develop`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`pull_request`</span>: branches <span class=\"hljs-code\">`main`</span>, <span class=\"hljs-code\">`develop`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`workflow_dispatch`</span>: Manual trigger\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`schedule`</span>: <span class=\"hljs-code\">`cron: '0 3 * * 1'`</span> (Every Monday at 03:00 UTC)\n<span class=\"hljs-bullet\">-</span> Job: <span class=\"hljs-code\">`security-scan`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`runs-on: ubuntu-latest`</span>\n<span class=\"hljs-bullet\">  -</span> Permissions\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`security-events: write`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`contents: read`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`actions: read`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`packages: read`</span>\n<span class=\"hljs-bullet\">  -</span> Steps (Chronological)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Checkout code`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`uses: actions/checkout@v4`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Setup Node.js`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`uses: actions/setup-node@v3`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`with: node-version: '18'`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Install JS dependencies`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: npm install || echo \"No package.json found\"`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Run npm audit (JS)`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: mkdir -p security-reports; npm audit --json &gt; security-reports/npm-audit.json || true`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Setup Python`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`uses: actions/setup-python@v4`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`with: python-version: '3.x'`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Install Bandit, PHPStan, ShellCheck`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: |`</span>\n<span class=\"hljs-bullet\">        -</span> <span class=\"hljs-code\">`pip install bandit semgrep`</span>\n<span class=\"hljs-bullet\">        -</span> <span class=\"hljs-code\">`sudo apt-get update &amp;&amp; sudo apt-get install -y shellcheck php-cli php-xml php-mbstring`</span>\n<span class=\"hljs-bullet\">        -</span> <span class=\"hljs-code\">`composer global require phpstan/phpstan || echo \"PHPStan install skipped\"`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Run Bandit scan (Python)`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: bandit -r . -f json -o security-reports/bandit-report.json || true`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Run ShellCheck (Bash)`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: mkdir -p security-reports/shellcheck; find . -name '*.sh' -exec shellcheck -f json -o security-reports/shellcheck/{}.json {} \\; || true`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Run PHPStan (PHP)`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: ~/.composer/vendor/bin/phpstan analyse --error-format=json &gt; security-reports/phpstan-report.json || true`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Run ripgrep for secrets`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: rg --json --json-path '.data.lines[0].text' --json-seq --json-seq-delim '\\n' 'token|password|secret|apikey|api_key|access_key|auth' &gt; security-reports/ripgrep-report.json || true`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Run Semgrep with custom rules`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`run: semgrep --config semgrep-rules --json --output security-reports/semgrep-report.json || true`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Initialize CodeQL`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`uses: github/codeql-action/init@v3`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`with: languages: javascript, python, php, bash`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Perform CodeQL Analysis`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`uses: github/codeql-action/analyze@v3`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`Upload Security Reports`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`uses: actions/upload-artifact@v3`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`with: name: security-reports; path: security-reports/`</span>\n\n<span class=\"hljs-section\">## Security Scanners &amp; Configurations</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**npm audit**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: JavaScript dependency vulnerability scanner\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Bandit (Python)**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: Python code security analyzer\n<span class=\"hljs-bullet\">  -</span> Command: <span class=\"hljs-code\">`bandit -r . -f json -o security-reports/bandit-report.json`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**ShellCheck (Bash)**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: Bash script linting for errors and potential risks\n<span class=\"hljs-bullet\">  -</span> Command: <span class=\"hljs-code\">`find . -name '*.sh' -exec shellcheck -f json -o security-reports/shellcheck/{}.json {} \\;`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**PHPStan (PHP)**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: PHP static analysis tool\n<span class=\"hljs-bullet\">  -</span> Command: <span class=\"hljs-code\">`~/.composer/vendor/bin/phpstan analyse --error-format=json &gt; security-reports/phpstan-report.json`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Ripgrep**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: Fast search for sensitive patterns (tokens, passwords, API keys)\n<span class=\"hljs-bullet\">  -</span> Patterns: <span class=\"hljs-code\">`token|password|secret|apikey|api_key|access_key|auth`</span>\n<span class=\"hljs-bullet\">  -</span> Command: <span class=\"hljs-code\">`rg --json ... &gt; security-reports/ripgrep-report.json`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Semgrep**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: Multi-language security and code quality scanner\n<span class=\"hljs-bullet\">  -</span> Configuration: Uses custom rules from <span class=\"hljs-code\">`semgrep-rules/`</span> directory\n<span class=\"hljs-bullet\">  -</span> Command: <span class=\"hljs-code\">`semgrep --config semgrep-rules --json --output security-reports/semgrep-report.json`</span>\n<span class=\"hljs-bullet\">  -</span> Custom Semgrep Rules (<span class=\"hljs-code\">`semgrep-rules/`</span>)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`README.md`</span>: Description of rules and local test command\n<span class=\"hljs-bullet\">      -</span> Local Test: <span class=\"hljs-code\">`semgrep --config semgrep-rules/ .`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`hardcoded-secrets.yaml`</span>\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`hardcoded-secret`</span>\n<span class=\"hljs-bullet\">      -</span> Patterns: <span class=\"hljs-code\">`api_key = \"$SECRET\"`</span>, <span class=\"hljs-code\">`password = \"$SECRET\"`</span>, <span class=\"hljs-code\">`token = \"$SECRET\"`</span>, <span class=\"hljs-code\">`const API_KEY = \"$SECRET\"`</span>, <span class=\"hljs-code\">`export SECRET=*`</span>\n<span class=\"hljs-bullet\">      -</span> Message: \"Hardcoded secret found. Consider environment variables or secret managers.\"\n<span class=\"hljs-bullet\">      -</span> Severity: ERROR\n<span class=\"hljs-bullet\">      -</span> Languages: <span class=\"hljs-code\">`[python, javascript, php, bash]`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`dangerous-functions.yaml`</span>\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`dangerous-eval`</span> (patterns: <span class=\"hljs-code\">`eval(...)`</span>)\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`dangerous-exec`</span> (patterns: <span class=\"hljs-code\">`exec(...)`</span>)\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`dangerous-system`</span> (patterns: <span class=\"hljs-code\">`system(...)`</span>)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`logging-sensitive-data.yaml`</span>\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`sensitive-data-logging`</span> (patterns: <span class=\"hljs-code\">`console.log($SENSITIVE)`</span>)\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`python-logging-sensitive`</span> (patterns: <span class=\"hljs-code\">`logging.info($SENSITIVE)`</span>)\n<span class=\"hljs-bullet\">      -</span> ID: <span class=\"hljs-code\">`php-logging-sensitive`</span> (patterns: <span class=\"hljs-code\">`error_log($SENSITIVE)`</span>)\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**CodeQL**</span>\n<span class=\"hljs-bullet\">  -</span> Purpose: Deep static analysis for multiple languages\n<span class=\"hljs-bullet\">  -</span> Languages: <span class=\"hljs-code\">`javascript, python, php, bash`</span>\n\n<span class=\"hljs-section\">## Reporting &amp; Extraction (`tools/extract<span class=\"hljs-emphasis\">_reports.py`)\n- Purpose: Aggregates and displays findings from various scan tools into a readable summary.\n- Execution: `python3 tools/extract_</span>reports.py`</span>\n<span class=\"hljs-bullet\">-</span> Extraction Functions\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`extract_semgrep_issues()`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`extract_bandit_issues()`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`extract_phpstan_issues()`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`extract_shellcheck_issues()`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`extract_ripgrep_issues()`</span>\n\n<span class=\"hljs-section\">## Installation &amp; Usage Instructions</span>\n<span class=\"hljs-bullet\">-</span> Initial Setup\n<span class=\"hljs-bullet\">  -</span> Clone repository: <span class=\"hljs-code\">`git clone https://github.com/tuoutente/tgfeed-security-enhancer.git`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**OR**</span> Apply patch: <span class=\"hljs-code\">`git apply patches/add-security-scan.patch`</span>\n<span class=\"hljs-bullet\">-</span> Configuration\n<span class=\"hljs-bullet\">  -</span> Modify <span class=\"hljs-code\">`.github/workflows/security-scan.yml`</span> for specific branches/tags\n<span class=\"hljs-bullet\">  -</span> Customize or add rules in <span class=\"hljs-code\">`semgrep-rules/`</span>\n<span class=\"hljs-bullet\">  -</span> Install local dependencies for local scanning\n<span class=\"hljs-bullet\">-</span> Execution\n<span class=\"hljs-bullet\">  -</span> GitHub Actions: Automated on push, pull request, or weekly schedule\n<span class=\"hljs-bullet\">  -</span> Local: <span class=\"hljs-code\">`python3 tools/extract_reports.py`</span> to view aggregated reports\n\n<span class=\"hljs-section\">## Patch File (`patches/add-security-scan.patch`)</span>\n<span class=\"hljs-bullet\">-</span> Description: Unified diff for adding/modifying workflow, Semgrep rules, and extraction script.\n<span class=\"hljs-bullet\">-</span> Target Files: <span class=\"hljs-code\">`.github/workflows/security-scan.yml`</span>, <span class=\"hljs-code\">`semgrep-rules/*`</span>, <span class=\"hljs-code\">`tools/extract_reports.py`</span>\n\n<span class=\"hljs-section\">## .gitignore Configuration</span>\n<span class=\"hljs-bullet\">-</span> Excluded items: <span class=\"hljs-code\">`node_modules/`</span>, <span class=\"hljs-code\">`vendor/`</span>, <span class=\"hljs-code\">`__pycache__/`</span>, <span class=\"hljs-code\">`*.pyc`</span>, <span class=\"hljs-code\">`security-reports/`</span>, <span class=\"hljs-code\">`.env*`</span>, <span class=\"hljs-code\">`.DS_Store`</span>, <span class=\"hljs-code\">`venv/`</span>, <span class=\"hljs-code\">`.env/`</span>\n\n<span class=\"hljs-section\">## LICENSE</span>\n<span class=\"hljs-bullet\">-</span> MIT License\n\n<span class=\"hljs-section\">## Final Notes/Recommendations</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Decision:**</span> Amplify <span class=\"hljs-code\">`semgrep-rules/`</span> with more targeted rules for specific project risks.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Decision:**</span> Workflow can be parameterized for specific branches or tags.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Decision:**</span> Integrate notifications (e.g., Slack, email) for critical vulnerabilities.\n</code></pre>","children":[]},null)</script>

            })(() => window.markmap,null,{"content":"<pre><code class=\"language-markmap\">---\nmarkmap:\n  color:\n    - \"#1E90FF\"\n    - \"#3CB371\"\n    - \"#FFD700\"\n    - \"#FF6347\"\n    - \"#8A2BE2\"\n  preset: colorful\n---\n\n# Auto Ansible Playbook Generator &amp; Security Auditor with AI\n\n## 📝 Project Overview\n-   **Main Goal**: Automate generation of secure Ansible playbooks from Docker Compose and VPS configurations, leveraging AI, with multiple outputs and notifications.\n-   **Context &amp; Purpose**:\n    -   Address complexity of managing scattered server/container configs.\n    -   Automate configuration collection, analysis, and secure Ansible playbook generation.\n    -   Facilitate secure environment recreation, security audits, config management, and CI/CD integration.\n-   **Key Features**:\n    -   Automated scanning of `docker-compose.yml` and VPS configurations (IP, users, SSH, DNS).\n    -   Analysis and transformation via Gemini (or GPT-like) API.\n    -   Generation of modular, secure Ansible playbooks.\n    -   Multiple output formats: JSON (for CI/CD), HTML (for reports).\n    -   Notifications (Telegram, email) for detected risks or errors.\n    -   Modular design for easy extension with new modules and API providers.\n    -   CLI and Web UI for interaction.\n    -   Dynamic/pre-processed documentation from Markdown files.\n-   **Core Technologies**:\n    -   Python 3.9+\n    -   Docker &amp; Docker Compose\n    -   Ansible, Jinja2, PyYAML\n    -   FastAPI (Web UI &amp; API), Flask (Doc Middleware)\n    -   Click (CLI)\n    -   Gemini API (AI assistance)\n    -   Bash scripting\n    -   HTTPX (API client), python-telegram-bot, smtplib (Notifications)\n    -   MkDocs (Documentation build)\n    -   pytest (Testing)\n\n## 📁 Project Structure (`docker-compose-to-ansible-ai/`)\n-   `app/` (FastAPI main application)\n    -   `__init__.py`\n    -   `config.py` - Pydantic BaseSettings for environment variables.\n    -   `analyzer.py` - Logic for `docker-compose.yml` and security analysis.\n    -   `ansible_generator.py` - Jinja2-based Ansible playbook generation.\n    -   `ai_integration.py` - Client for Gemini API.\n    -   `notifier.py` - Modules for Telegram and email notifications.\n    -   `main.py` - FastAPI orchestrator, API endpoints.\n    -   `templates/`\n        -   `playbook.yml.j2` - Jinja2 template for Ansible playbook.\n-   `cli.py` - Command-line interface using Click.\n-   `docs/` - Source Markdown files for documentation (original, unmodified).\n    -   `index.md`\n    -   `installation.md`\n    -   `usage.md`\n    -   `faq.md`\n-   `docs_server/` - Flask middleware for on-the-fly documentation processing.\n    -   `app_doc.py` - Serves Markdown with dynamic frontmatter and TOC.\n-   `preprocess_doc.py` - Script to generate preprocessed Markdown files for static site generators.\n-   `mkdocs.yml` - Configuration for MkDocs to build static documentation from `docs_processed/`.\n-   `bootstrap.sh` - One-liner script for automatic project setup.\n-   `Dockerfile` - Docker image definition for the main application and doc server.\n-   `.env.example` - Template for environment variables.\n-   `requirements.txt` - Python dependencies.\n-   `examples/`\n    -   `sample-docker-compose.yml` - Example Docker Compose file.\n    -   `sample-inventory.json` - Example Ansible inventory.\n-   `scripts/`\n    -   `deploy.sh` - Automated deployment script (Docker build, push, SSH deploy).\n    -   `test_playbook_generation.py` - Pytest example for playbook generation.\n-   `.github/`\n    -   `workflows/`\n        -   `ci-cd.yml` - GitHub Actions for CI/CD pipeline.\n-   `.gitignore`\n-   `LICENSE`\n-   `README.md`\n\n## ⚙️ Setup &amp; Configuration\n-   **Prerequisites**:\n    -   Python 3.9+\n    -   Docker (for containerized deployment)\n    -   SSH access to target servers\n    -   Gemini API Key\n    -   (Optional) Telegram Bot Token &amp; Chat ID, SMTP server/user/password\n-   **Installation Steps**:\n    1.  Clone repository: `git clone https://github.com/tuoutente/docker-compose-to-ansible-ai.git`\n    2.  Navigate to project: `cd docker-compose-to-ansible-ai`\n    3.  Create virtual environment: `python3 -m venv .venv`\n    4.  Activate virtual environment: `source .venv/bin/activate`\n    5.  Install dependencies: `pip install -r requirements.txt`\n    6.  Copy example environment file: `cp .env.example .env`\n    7.  Configure `.env` with API keys and credentials.\n-   **`requirements.txt`**:\n    -   `fastapi`, `uvicorn`, `pyyaml`, `jinja2`, `httpx`, `click`, `python-telegram-bot`, `flask`, `markdown`, `pydantic`, `pytest`\n-   **`.env.example`**:\n    -   `GEMINI_API_KEY=your_gemini_api_key_here`\n    -   `TELEGRAM_BOT_TOKEN=your_telegram_bot_token`\n    -   `TELEGRAM_CHAT_ID=your_telegram_chat_id`\n    -   `SMTP_SERVER=smtp.example.com`, `SMTP_PORT=587`, `SMTP_USERNAME=user@example.com`, `SMTP_PASSWORD=your_smtp_password`\n    -   `NOTIFY_LEVEL=HIGH`\n-   **`.gitignore`**:\n    -   `.venv/`, `__pycache__/`, `docs_processed/`, `*.pyc`, `.env`, `*.log`\n\n## 🚀 Usage (CLI &amp; Web UI)\n-   **CLI Usage (`cli.py`)**:\n    -   Command: `python cli.py generate --compose &lt;path/to/docker-compose.yml&gt; --inventory &lt;path/to/inventory.json&gt; --output &lt;playbook.yml&gt;`\n    -   Functionality: Loads compose/inventory, analyzes, generates playbook, saves to file.\n-   **Web UI / API (`app/main.py`)**:\n    -   Run: `uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload`\n    -   Endpoints:\n        -   `/analyze/` (`POST`): Uploads `docker-compose.yml`, performs analysis, gets AI suggestions, sends notifications for issues. Returns JSON.\n        -   `/generate_playbook/` (`POST`): Uploads `docker-compose.yml` and inventory, generates Ansible playbook. Returns YAML.\n    -   Authentication: (Proposed, not fully implemented in provided code) Login route, session management, `login_required` decorator for routes.\n\n## 🧠 AI Integration (Gemini)\n-   **`app/ai_integration.py`**:\n    -   `GeminiAI` class: Initializes with `GEMINI_API_KEY`.\n    -   `ask(prompt: str)`: Sends prompt to Gemini API, retrieves text response.\n-   **Role of AI**:\n    -   Receives analysis data (from `app/analyzer.py`).\n    -   Generates suggestions for security improvements, configuration optimization.\n    -   *Decision:* The AI provides suggestions; `ansible_generator.py` module creates the actual playbook.\n\n## 📬 Notifications\n-   **`app/notifier.py`**:\n    -   `Notifier` class: Configured with Telegram/SMTP settings from `.env`.\n    -   `send_email(subject, body, to_addr)`: Sends email via SMTP.\n    -   `send_telegram(message)`: Sends message via Telegram Bot API.\n-   **Triggering**:\n    -   Invoked from `app/main.py` when security issues are detected during analysis.\n    -   Configurable `NOTIFY_LEVEL` in `.env` (e.g., HIGH).\n\n## 📄 Documentation System\n-   **Objective**: Use existing Markdown files (`docs/`) to generate a modern documentation site without modifying original files.\n-   **`docs_server/app_doc.py` (Flask Middleware)**:\n    -   Runs on a separate port (e.g., 5001).\n    -   Reads Markdown files from `docs/`.\n    -   Dynamically adds YAML frontmatter (title, TOC enabled) and a Markdown-formatted Table of Contents.\n    -   Serves the processed Markdown content directly.\n    -   **Usage (On-the-fly)**: `python docs_server/app_doc.py` then browse `http://localhost:5001/installation.md`.\n-   **`preprocess_doc.py` (Preprocessing Script)**:\n    -   Reads Markdown files from `docs/`.\n    -   Generates processed copies (with frontmatter and TOC) into a `docs_processed/` directory.\n    -   **Usage (for Static Build)**: `python preprocess_doc.py --src docs --dest docs_processed`\n-   **`mkdocs.yml`**:\n    -   Configures MkDocs to build a static site.\n    -   `docs_dir: docs_processed` - Points to the preprocessed documentation.\n    -   Defines navigation structure.\n    -   Uses `mkdocs` theme and `toc` markdown extension.\n\n## 🐳 Deployment &amp; Automation\n-   **Bootstrap (`bootstrap.sh`)**:\n    -   `curl -fsSL ... | sh`\n    -   Clones repo, creates/activates venv, installs dependencies.\n    -   Copies `.env.example` to `.env`.\n    -   Starts `uvicorn app.main:app` (FastAPI) and `python docs_server/app_doc.py` (Flask).\n-   **Docker (`Dockerfile`, `docker-compose.yml`)**:\n    -   `Dockerfile`: Builds `python:3.10-slim` image, installs dependencies, copies code, sets environment variables, exposes ports (8000 for FastAPI, 5001 for Flask).\n    -   `CMD`: Runs both FastAPI and Flask doc server concurrently using `sh -c`.\n    -   `docker-compose.yml`: (Not explicitly provided in final log, but implied for easy local deployment of Dockerfile) Would define a service building the Dockerfile, mapping ports, and mounting volumes.\n    -   **Usage**: `docker build -t dc2ansible-doc .` then `docker run -d -p 8000:8000 -p 5001:5001 --env-file .env dc2ansible-doc`\n-   **Automated Deployment (`scripts/deploy.sh`)**:\n    -   Builds Docker image locally (`docker build`).\n    -   Pushes image to Docker Hub (`docker push`).\n    -   Connects to remote server via SSH.\n    -   Pulls latest image, stops/removes old container, starts new container.\n-   **CI/CD (`.github/workflows/ci-cd.yml`)**:\n    -   **`on: push`, `pull_request`** to `main` branch.\n    -   **`test` job**:\n        -   Runs on `ubuntu-latest`.\n        -   Sets up Python 3.10.\n        -   Installs dependencies.\n        -   Executes `pytest -v`.\n    -   **`docker_build_push` job**:\n        -   `needs: test`.\n        -   Conditional `if: github.ref == 'refs/heads/main'`.\n        -   Logs into Docker Hub using secrets (`DOCKER_USERNAME`, `DOCKER_PASSWORD`).\n        -   Builds and pushes Docker image (`tuoutente/dc2ansible:latest`).\n    -   **`deploy` job**:\n        -   `needs: docker_build_push`.\n        -   Conditional `if: github.ref == 'refs/heads/main'`.\n        -   Uses `appleboy/ssh-action` for SSH deploy.\n        -   Pulls latest image, stops/removes old container, starts new container on remote host.\n        -   Uses GitHub Secrets for `REMOTE_HOST`, `REMOTE_USER`, `SSH_PRIVATE_KEY`.\n    -   **GitHub Secrets**: Requires `DOCKER_USERNAME`, `DOCKER_PASSWORD`, `REMOTE_HOST`, `REMOTE_USER`, `SSH_PRIVATE_KEY` configured in repository settings.\n\n## 🧪 Testing &amp; Development\n-   **`pytest`**: Main testing framework.\n-   **`scripts/test_playbook_generation.py`**:\n    -   Tests `load_docker_compose`, `analyze_services`, `generate_playbook`.\n-   **`tests/test_analyzer.py`**:\n    -   Uses `@pytest.fixture` for sample compose files.\n    -   Tests `load_docker_compose` and `analyze_services`.\n-   **`tests/test_ansible_generator.py`**:\n    -   Tests `generate_playbook` with sample analysis and inventory.\n-   **`tests/test_ai_integration.py`**:\n    -   Uses `@pytest.mark.asyncio` and `monkeypatch` to mock `httpx.AsyncClient.post`.\n    -   Tests `GeminiAI.ask` method.\n\n## 🏛️ Project Management\n-   **License**: MIT License (`LICENSE` file included).\n-   **Repository Name**: `docker-compose-to-ansible-ai`\n-   **Short Description**: \"Trasforma automaticamente i tuoi file Docker Compose e configurazioni VPS in playbook Ansible ottimizzati, con supporto AI per analisi di sicurezza, generazione di configurazioni Docker sicure e notifiche integrate.\"\n-   **Podcast/Video Description**: Detailed narrative covering problem, context, solution, AI role, CI/CD benefits, and impact.\n-   **GitHub Page**:\n    -   Can be built using Jekyll from existing Markdown files in `docs/` with `_config.yml`.\n    -   Alternatively, use the `preprocess_doc.py` script to generate a `docs_processed/` directory and build with MkDocs.\n\n## 🚀 Future Enhancements\n-   Implement full authentication for Web UI and documentation server.\n-   Integrate CI/CD pipelines with automatic documentation generation and deployment.\n-   Support Docusaurus as an alternative static site generator.\n-   Add notifications for documentation updates.\n-   Develop custom MkDocs/Docusaurus plugins for dynamic frontmatter/TOC injection during build.\n-   Advanced UI features (e.g., React/Vue frontend).\n-   Integration with remote SSH for discovery.\n-   Packaging for `.deb` or `.rpm`.\n-   More advanced security policy enforcement.\n</code></pre>","children":[]},null)</script>

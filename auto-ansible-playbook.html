            })(() => window.markmap,null,{"content":"<pre><code class=\"language-markmap\"># Docker Compose to Ansible AI + Security Auditor &amp; Documentazione Automatica\n\n## 🎯 Obiettivi del Progetto\n- Analisi configurazioni Docker Compose e VPS\n- Generazione playbook Ansible sicuri e ottimizzati\n- Integrazione Gemini API per suggerimenti AI e controlli di sicurezza\n- Output multipli (JSON, HTML) per CI/CD e reportistica\n- Notifiche in tempo reale (Telegram/Email)\n- Interfaccia CLI e Web (FastAPI)\n- Supporto alla documentazione Markdown (frontmatter/TOC dinamici o preprocessati)\n- Bootstrap automatico (`curl | sh`)\n- Deployment containerizzato (Docker)\n\n## ℹ️ Contesto e Finalità\n- Gestione efficace, sicura e coerente di servizi container e VPS\n- Automatizzazione processi di deployment complessi e rischiosi\n- Mitigazione errori umani e riduzione tempo di manutenzione\n- Unificazione workflow di provisioning e gestione documentazione\n- Coerenza tra codice, documentazione e deployment\n\n## 🛠 Installazione &amp; Configurazione\n### Prerequisiti\n- Python 3.9+\n- Docker (per containerizzazione)\n- Accesso SSH (per server target)\n- API Key Gemini\n- Account Telegram / SMTP (per notifiche)\n### Installazione Manuale\n- `git clone https://github.com/tuoutente/docker-compose-to-ansible-ai.git`\n- `cd docker-compose-to-ansible-ai`\n- `python3 -m venv .venv`\n- `source .venv/bin/activate`\n- `pip install -r requirements.txt`\n- `cp .env.example .env`\n- Modifica `.env` con credenziali\n- `uvicorn app.main:app --reload` (Avvio FastAPI per app principale)\n### Bootstrap Automatico\n- Comando: `curl -fsSL https://raw.githubusercontent.com/tuoutente/docker-compose-to-ansible-ai/main/bootstrap.sh | sh`\n- Include:\n  - Creazione `.venv` e installazione dipendenze\n  - Copia `.env.example`\n  - Avvio `uvicorn app.main:app` (porta 8000)\n  - Avvio `docs_server/app_doc.py` (porta 5001)\n\n## 🚀 Utilizzo\n### Interfaccia a Riga di Comando (CLI)\n- Comando principale: `python cli.py`\n- `generate` comando:\n  - `python cli.py generate --compose path/to/docker-compose.yml --inventory path/to/inventory.json --output playbook.yml`\n### Interfaccia Web (FastAPI) &amp; API\n- Avvio: `uvicorn app.main:app` (parte del bootstrap)\n- Accesso browser: `http://localhost:8000` (per UI o API docs)\n- Endpoint API:\n  - `POST /analyze/`: Carica docker-compose, analizza, riceve suggerimenti AI, invia notifiche\n  - `POST /generate_playbook/`: Carica docker-compose + inventory, genera playbook YAML\n### Gestione Documentazione\n#### Preview \"On-the-Fly\" (Middleware Flask)\n- Avvio: `python docs_server/app_doc.py` (server Flask, porta 5001, parte del bootstrap)\n- Accesso browser: `http://localhost:5001/installation.md`\n- Outcome: Markdown servito con frontmatter e TOC generati dinamicamente.\n#### Build Statica (Preprocessing con MkDocs)\n- Esegui preprocessing: `python preprocess_doc.py --src docs --dest docs_processed`\n- Costruisci MkDocs: `mkdocs build`\n- Servi MkDocs: `mkdocs serve`\n- Decision: Configura `docs_dir: docs_processed` in `mkdocs.yml`\n\n## 📦 Struttura del Progetto\n- `docker-compose-to-ansible-ai/` (Root)\n  - `app/`: Core backend &amp; API (FastAPI)\n    - `main.py`: Orchestratore FastAPI\n    - `config.py`: Gestione configurazioni (Pydantic, .env)\n    - `analyzer.py`: Caricamento/analisi docker-compose, rilevamento security issues\n    - `ansible_generator.py`: Generazione playbook Ansible (Jinja2)\n    - `ai_integration.py`: Client Gemini API\n    - `notifier.py`: Invio notifiche (Telegram, Email)\n    - `templates/`: Template Jinja2 per playbook Ansible (`playbook.yml.j2`)\n  - `cli.py`: Interfaccia a riga di comando (Click)\n  - `docs/`: Documentazione sorgente Markdown (originale, senza frontmatter)\n    - `index.md`, `installation.md`, `usage.md`, `faq.md`\n  - `docs_server/`: Middleware Flask per documentazione on-the-fly\n    - `app_doc.py`: Serve Markdown con frontmatter/TOC dinamici\n  - `preprocess_doc.py`: Script per generare Markdown con frontmatter/TOC in `docs_processed/`\n  - `mkdocs.yml`: Configurazione per MkDocs (per la build statica della documentazione)\n  - `bootstrap.sh`: Script di avvio rapido (curl | sh)\n  - `Dockerfile`: Definizione immagine Docker per deployment (app + doc server)\n  - `.env.example`: Esempio variabili d'ambiente\n  - `requirements.txt`: Dipendenze Python\n  - `examples/`: File di esempio\n    - `sample-docker-compose.yml`, `sample-inventory.json`\n  - `scripts/`: Script ausiliari\n    - `test_playbook_generation.py`: Esempio di test per la generazione di playbook\n  - `.gitignore`: File ignorati da Git\n  - `LICENSE`: Licenza del progetto (MIT)\n  - `README.md`: Documentazione principale del repository\n\n## 🧰 Tecnologie Utilizzate\n- **Core Application:**\n  - Python 3.9+\n  - FastAPI, Uvicorn (Web/API)\n  - Click (CLI)\n  - PyYAML (Parsing YAML)\n  - Jinja2 (Templating Ansible)\n  - HTTPX (Client API)\n  - Pydantic (Gestione configurazione)\n- **AI Integration:**\n  - Gemini API\n- **Notifiche:**\n  - python-telegram-bot\n  - SMTPlib (Email)\n- **Documentazione:**\n  - Flask (Doc Middleware)\n  - Markdown Python library (Parsing Markdown, TOC)\n  - MkDocs (Generatore di siti statici per doc)\n- **Deployment:**\n  - Docker\n  - Bash Scripting\n- **Testing:**\n  - Pytest\n- **CI/CD:**\n  - GitHub Actions\n\n## 🐳 Deployment (Docker)\n- `Dockerfile`:\n  - `FROM python:3.10-slim`\n  - Installa dipendenze da `requirements.txt`\n  - Copia codice (`.`)\n  - `ENV` per configurazioni (.env)\n  - `EXPOSE 8000` (FastAPI) e `5001` (Doc Server)\n  - `CMD [\"sh\", \"-c\", \"uvicorn app.main:app --host 0.0.0.0 --port 8000 &amp; python docs_server/app_doc.py\"]`\n- `docker-compose.yml` (Non esplicitamente incluso nell'output finale ma implicito per orchestrazione)\n\n## 🧪 Testing Avanzato\n- Framework: Pytest\n- `scripts/test_playbook_generation.py`: Test base per `ansible_generator`\n- Test per `analyzer`: Caricamento e analisi di `sample_compose`\n- Test per `ai_integration`: Simulazione risposta API Gemini\n- Test per `docs_server/app_doc.py`: Verifica generazione frontmatter e TOC on-the-fly\n- Test per `preprocess_doc.py`: Verifica generazione file preprocessati\n\n## 🔄 CI/CD (GitHub Actions)\n- File: `.github/workflows/ci-cd.yml`\n- Job `test`:\n  - Run su `ubuntu-latest`\n  - Setup Python, installa dipendenze\n  - Esegue `pytest -v`\n- Job `docker_build_push`:\n  - Dipende da `test`\n  - Log in a Docker Hub (usa `secrets.DOCKER_USERNAME`, `secrets.DOCKER_PASSWORD`)\n  - Build &amp; push immagine Docker: `tuoutente/dc2ansible:latest`\n- Job `deploy`:\n  - Dipende da `docker_build_push`\n  - Trigger `if: github.ref == 'refs/heads/main'`\n  - Usa `appleboy/ssh-action`\n  - Tira immagine, stoppa/rimuovi vecchio container, avvia nuovo\n  - Richiede GitHub Secrets: `REMOTE_HOST`, `REMOTE_USER`, `SSH_PRIVATE_KEY`\n\n## 🔐 GitHub Secrets &amp; Autenticazione\n### GitHub Secrets (per CI/CD)\n- `DOCKER_USERNAME`, `DOCKER_PASSWORD`\n- `REMOTE_HOST`, `REMOTE_USER`, `SSH_PRIVATE_KEY`\n- Configurazione in: Repository Settings &gt; Secrets and variables &gt; Actions\n### Autenticazione Web UI (non implementata nel codice finale, ma discussa)\n- Decision: Se richiesta, implementare login/logout con sessioni Flask/FastAPI\n- Placeholder: `app.secret_key`, `USERNAME`, `PASSWORD`\n- `app.py` modifiche per `@login_required` e rotte `/login`, `/logout`\n\n## 📜 Licenza\n- MIT License\n- Copyright (c) 2025 Your Name\n\n## 📚 Esempi\n- `examples/sample-docker-compose.yml`\n- `examples/sample-inventory.json`\n</code></pre>","children":[]},null)</script>

            })(() => window.markmap,null,{"content":"<pre><code class=\"language-markdown\"><span class=\"hljs-section\"># Manuale di Programmazione Dichiarativa con Ansible</span>\n\n<span class=\"hljs-section\">## Introduzione al Concetto</span>\n<span class=\"hljs-section\">### Obiettivo Iniziale</span>\n<span class=\"hljs-bullet\">-</span> Costruire un manuale base di programmazione usando il paradigma dichiarativo\n<span class=\"hljs-bullet\">-</span> Sfruttare Ansible come “linguaggio” didattico\n<span class=\"hljs-bullet\">-</span> Mostrare esempi concreti di concetti fondamentali (variabili, condizioni, cicli, modularità)\n<span class=\"hljs-bullet\">-</span> Confrontare brevemente con Python o pseudocodice\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Decision:**</span> Utilizzare Ansible per insegnare, spostando il focus dal <span class=\"hljs-emphasis\">*come*</span> al <span class=\"hljs-emphasis\">*cosa*</span>.\n\n<span class=\"hljs-section\">### Paradigmi di Programmazione</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Imperativo (Python):**</span> Spieghi <span class=\"hljs-emphasis\">*come*</span> fare qualcosa passo-passo.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Dichiarativo (Ansible):**</span> Descrivi <span class=\"hljs-emphasis\">*cosa*</span> vuoi ottenere, lasciando al sistema il compito di capire <span class=\"hljs-emphasis\">*come*</span> farlo.\n\n<span class=\"hljs-section\">### Concetti Fondamentali in Ansible (Confronto Imperativo vs Dichiarativo)</span>\n<span class=\"hljs-section\">#### 1. Variabili e Assegnazione</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Python (Imperativo):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`x = 10`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`y = 20`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`z = x + y`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`print(z)`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Ansible (Dichiarativo):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`vars:`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`x: 10`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`y: 20`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`z: \"{{ x + y }}\"`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Spiegazione:**</span> <span class=\"hljs-code\">`vars`</span> contiene variabili; <span class=\"hljs-code\">`{{ }}`</span> per interpolazione; nessun flusso di esecuzione esplicito.\n\n<span class=\"hljs-section\">#### 2. Condizioni (if/else)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Python (Imperativo):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`x = 10`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`if x &gt; 5: print(\"Maggiore di 5\") else: print(\"Minore o uguale a 5\")`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Ansible (Dichiarativo):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`tasks:`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`- name: Verifica valore di x`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`debug: msg: \"Maggiore di 5\"`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`when: x &gt; 5`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`- name: Altrimenti`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`debug: msg: \"Minore o uguale a 5\"`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`when: x &lt;= 5`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Spiegazione:**</span> <span class=\"hljs-code\">`when`</span> filtra l'esecuzione del task; condizioni associate a task, non blocchi if-else espliciti.\n\n<span class=\"hljs-section\">#### 3. Cicli / Iterazioni (loop)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Python (Imperativo):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`for i in range(3): print(i)`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Ansible (Dichiarativo):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`tasks:`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`- name: Loop da 0 a 2`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`debug: msg: \"Indice: {{ item }}\"`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`loop: [0, 1, 2]`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Spiegazione:**</span> <span class=\"hljs-code\">`loop`</span> indica la lista; <span class=\"hljs-code\">`item`</span> è l'elemento corrente; nessun indice modificabile.\n\n<span class=\"hljs-section\">#### 4. Modularità e Riusabilità</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Python:**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`def saluta(nome): print(f\"Ciao {nome}\")`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`saluta(\"Mario\")`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**In Ansible (Ruoli e Include):**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`playbook.yml:`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`- hosts: all`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`  roles: - saluto`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`roles/saluto/tasks/main.yml:`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`- name: Saluta l'utente`</span>\n<span class=\"hljs-bullet\">      -</span> <span class=\"hljs-code\">`debug: msg: \"Ciao {{ nome }}\"`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Spiegazione:**</span> I <span class=\"hljs-strong\">**Ruoli**</span> sono moduli riutilizzabili che accettano variabili d'input.\n\n<span class=\"hljs-section\">#### 5. Esempio Completo (Variabili + Condizione + Ciclo)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`vars: utenti: [mario, luca, anna]`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`tasks:`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`- name: Saluta solo se nome ha più di 3 lettere`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`debug: msg: \"Ciao {{ item }}\"`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`loop: \"{{ utenti }}\"`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`when: item | length &gt; 3`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Spiegazione:**</span> Combina variabili, loop e condizioni in modo dichiarativo.\n\n<span class=\"hljs-section\">#### 6. Confronto Rapido: Imperativo vs Dichiarativo (Tabella)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Flusso:**</span> Imperativo (come iterare/controllare) vs Dichiarativo (cosa fare e quando).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Stato Variabile:**</span> Imperativo (<span class=\"hljs-code\">`i`</span> mutata) vs Dichiarativo (<span class=\"hljs-code\">`item`</span> fornito).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Controllo Flusso:**</span> Imperativo (<span class=\"hljs-code\">`if`</span>/<span class=\"hljs-code\">`else`</span> esplicito) vs Dichiarativo (<span class=\"hljs-code\">`when`</span> su task).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Riusabilità:**</span> Imperativo (funzioni) vs Dichiarativo (ruoli e include).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Idempotenza:**</span> Imperativo (nessuna garanzia) vs Dichiarativo (garantita tramite stato desiderato).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Outcome:**</span> Usare Ansible per insegnare richiede un cambio di mentalità dal <span class=\"hljs-emphasis\">*come*</span> al <span class=\"hljs-emphasis\">*cosa*</span>.\n\n<span class=\"hljs-section\">## Struttura del Manuale e Inizializzazione Progetto</span>\n<span class=\"hljs-section\">### Obiettivo del Manuale</span>\n<span class=\"hljs-bullet\">-</span> Insegnare concetti base di programmazione (variabili, condizioni, cicli, modularità) in modo dichiarativo con Ansible.\n<span class=\"hljs-bullet\">-</span> Favorire il passaggio mentale dal paradigma imperativo a quello dichiarativo.\n<span class=\"hljs-bullet\">-</span> Fornire esempi pratici con codice Ansible commentato e confronti con Python.\n<span class=\"hljs-bullet\">-</span> Costruire un percorso di apprendimento progressivo.\n<span class=\"hljs-bullet\">-</span> Preparare una base per un testo/manuale o corso didattico.\n\n<span class=\"hljs-section\">### Struttura del Progetto (`ansible-declarative-tutorial/`)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`README.md`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`docs/`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`01_intro.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`02_variabili.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`03_condizioni.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`04_cicli.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`05_modularita.md`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`06_esempi_completi.md`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`examples/`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`variables.yml`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`conditions.yml`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`loops.yml`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`roles/saluto/tasks/main.yml`</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-code\">`complete_example.yml`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`requirements.txt`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`LICENSE`</span>\n\n<span class=\"hljs-section\">### Contenuto Chiave dei File Iniziali</span>\n<span class=\"hljs-section\">#### `README.md`</span>\n<span class=\"hljs-bullet\">-</span> Obiettivi, struttura, prerequisiti, installazione, esecuzione esempi, contributi, licenza.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Command:**</span> <span class=\"hljs-code\">`pip install -r requirements.txt`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Command:**</span> <span class=\"hljs-code\">`ansible-playbook examples/variables.yml`</span>\n\n<span class=\"hljs-section\">#### `docs/01<span class=\"hljs-emphasis\">_intro.md`\n- Introduzione alla programmazione dichiarativa, Cos'è Ansible, Obiettivi.\n\n#### `examples/variables.yml`\n- `hosts: localhost`\n- `vars: x: 10, y: 20, z: \"{{ x + y }}\"`\n- `tasks: debug: msg: \"Il valore di z è {{ z }}\"`\n\n#### `examples/conditions.yml`\n- `hosts: localhost`\n- `vars: x: 10`\n- `tasks: debug: msg: \"x è maggiore di 5\" when: x &gt; 5`\n  - `debug: msg: \"x è minore o uguale a 5\" when: x &lt;= 5`\n\n#### `examples/loops.yml`\n- `hosts: localhost`\n- `vars: users: [mario, luca, anna]`\n- `tasks: debug: msg: \"Ciao {{ item }}\" loop: \"{{ users }}\"`\n\n#### `examples/roles/saluto/tasks/main.yml`\n- `- name: Saluta l'utente`\n- `debug: msg: \"Ciao {{ nome }}\"`\n\n#### `examples/complete_</span>example.yml`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`hosts: localhost`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`vars: utenti: [mario, luca, anna]`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`roles: - role: saluto vars: nome: \"default\"`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`tasks: include_role: name: saluto vars: nome: \"{{ item }}\" loop: \"{{ utenti }}\" when: item | length &gt; 3`</span>\n\n<span class=\"hljs-section\">#### `requirements.txt`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`ansible&gt;=2.10`</span>\n\n<span class=\"hljs-section\">#### `LICENSE`</span>\n<span class=\"hljs-bullet\">-</span> Contiene testo standard MIT License.\n\n<span class=\"hljs-section\">## Capitoli Dettagliati del Manuale</span>\n<span class=\"hljs-section\">### Capitolo 1: Introduzione alla Programmazione Dichiarativa con Ansible</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetti:**</span> Paradigmi imperativo vs dichiarativo, perché imparare con Ansible, struttura playbook.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio Imperativo (Python):**</span> <span class=\"hljs-code\">`somma = 0; for i in range(1, 11): somma += i`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio Dichiarativo (Ansible):**</span> <span class=\"hljs-code\">`debug: msg: \"{{ range(1,11) | sum }}\"`</span>\n\n<span class=\"hljs-section\">### Capitolo 2: Variabili in Ansible</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetti:**</span> Definizione (<span class=\"hljs-code\">`vars:`</span>), uso (<span class=\"hljs-code\">`{{ var }}`</span>), tipi (numeri, stringhe, liste, dizionari).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio Ansible:**</span> <span class=\"hljs-code\">`vars: nome: \"Anna\", eta: 25`</span>, <span class=\"hljs-code\">`tasks: debug: msg: \"Nome: {{ nome }}\"`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Confronto Python:**</span> <span class=\"hljs-code\">`nome = \"Anna\"; print(f\"Nome: {nome}\")`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Note:**</span> Variabili immutabili nel contesto del playbook, sovrascrivibili.\n\n<span class=\"hljs-section\">### Capitolo 3: Condizioni con `when`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetti:**</span> Esecuzione condizionale di task.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Sintassi base:**</span> <span class=\"hljs-code\">`when: condizione`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio Ansible:**</span> <span class=\"hljs-code\">`vars: x: 15`</span>, <span class=\"hljs-code\">`tasks: debug: msg: \"x è più grande di 10\" when: x &gt; 10`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Operatori:**</span> <span class=\"hljs-code\">`==, !=, &gt;, &lt;, &gt;=, &lt;=, and, or, not`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Confronto Python:**</span> <span class=\"hljs-code\">`if x &gt; 10: print(\"Maggiore\") else: print(\"Minore\")`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Note:**</span> <span class=\"hljs-code\">`when`</span> è un filtro Jinja2, supporta espressioni complesse.\n\n<span class=\"hljs-section\">### Capitolo 4: Cicli con `loop`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetti:**</span> Ripetizione di azioni per ogni elemento di una lista o intervallo.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Sintassi base:**</span> <span class=\"hljs-code\">`loop: [elementi]`</span>, <span class=\"hljs-code\">`item`</span> variabile corrente.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio Ansible:**</span> <span class=\"hljs-code\">`vars: utenti: [mario, lucia, anna]`</span>, <span class=\"hljs-code\">`tasks: debug: msg: \"Ciao {{ item }}\" loop: \"{{ utenti }}\"`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Loop con indici:**</span> <span class=\"hljs-code\">`loop: \"{{ range(1,6) | list }}\"`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Confronto Python:**</span> <span class=\"hljs-code\">`for utente in utenti: print(f\"Ciao {utente}\")`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Note:**</span> Loop in Ansible più limitato rispetto a Python (no break/continue).\n\n<span class=\"hljs-section\">### Capitolo 5: Modularità con Ruoli</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetti:**</span> Organizzare playbook complessi in parti riutilizzabili.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Struttura ruolo:**</span> <span class=\"hljs-code\">`roles/mio_ruolo/tasks/main.yml`</span>, <span class=\"hljs-code\">`vars/main.yml`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Uso ruolo:**</span> <span class=\"hljs-code\">`- hosts: localhost roles: - mio_ruolo`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Vantaggi:**</span> Riutilizzo, separazione di responsabilità, facilità di manutenzione.\n\n<span class=\"hljs-section\">### Capitolo 6: Gestione Errori e Controllo del Flusso</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetti:**</span> Prevenire interruzioni, gestire fallimenti.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**`ignore<span class=\"hljs-emphasis\">_errors`:** Continua esecuzione anche con task falliti.\n- **`failed_</span>when`, `changed<span class=\"hljs-emphasis\">_when`:** Condizione personalizzata per valutare fallimento o cambiamento.\n- **`block` e `rescue`:** Raggruppa task e gestisce errori (simile a try/catch).\n- **`when` con registri:** Salta task basati sul risultato di task precedenti.\n- **Confronto Python:** `try: ... except ZeroDivisionError: ...`\n\n### Capitolo 7: Template Jinja2 in Ansible\n- **Concetti:** Motore di template per generare contenuti dinamici con variabili, espressioni e filtri.\n- **Uso file `.j2`:** `template: src: template.conf.j2 dest: /path/to/file`\n- **Elementi Jinja2:** Variabili `{{ var }}`, Filtri `{{ var | lower }}`, Cicli/Condizioni `{% if %} ... {% endif %}`.\n- **Confronto Python:** String formatting (f-strings).\n\n### Capitolo 8: Callback Plugin e Personalizzazioni\n- **Concetti:** Plugin per eseguire azioni personalizzate durante o dopo l’esecuzione dei playbook (log, notifiche).\n- **Uso base:** `export ANSIBLE_</span>CALLBACK<span class=\"hljs-emphasis\">_WHITELIST='json'`\n- **Scrivere custom callback (Python):** Metodi come `v2_</span>runner<span class=\"hljs-emphasis\">_on_</span>ok`, `v2<span class=\"hljs-emphasis\">_runner_</span>on<span class=\"hljs-emphasis\">_failed`.\n- **Perché usarlo:** Monitoraggio personalizzato, integrazione con sistemi esterni, logging avanzato.\n\n## Esempi Pratici e Laboratori\n### Esempi Pratici Iniziali\n- **Esempio 1: Installare e configurare Nginx con template**\n  - Playbook per Nginx, `nginx.conf.j2` con `server_</span>name` dinamico.\n  - Handler per `restart nginx`.\n- **</span>Esercizio 1:** Scrivi un playbook che crea un utente con un gruppo specifico, usando variabili e condizioni.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio 2: Gestione errori con block e rescue**</span>\n<span class=\"hljs-bullet\">  -</span> Playbook con <span class=\"hljs-code\">`command: /bin/false`</span> in <span class=\"hljs-code\">`block`</span>, gestito da <span class=\"hljs-code\">`rescue`</span> task.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio 2:**</span> Modifica l’esempio sopra per registrare l’output del comando fallito e usarlo nel rescue.\n\n<span class=\"hljs-section\">### Laboratori Pratici con Soluzioni</span>\n<span class=\"hljs-section\">#### Laboratorio 1: Installare e configurare un servizio (Docker/Nginx)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Obiettivo:**</span> Installa Docker, aggiunge utente al gruppo <span class=\"hljs-code\">`docker`</span>, avvia container Nginx.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Soluzione:**</span> Playbook completo con <span class=\"hljs-code\">`apt`</span>, <span class=\"hljs-code\">`apt_key`</span>, <span class=\"hljs-code\">`apt_repository`</span>, <span class=\"hljs-code\">`user`</span>, <span class=\"hljs-code\">`docker_container`</span>.\n\n<span class=\"hljs-section\">#### Laboratorio 2: Gestione utenti e gruppi</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Obiettivo:**</span> Crea utenti con gruppi specifici, assegna password criptate e configura SSH.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Soluzione:**</span> Playbook con <span class=\"hljs-code\">`group`</span>, <span class=\"hljs-code\">`user`</span> (con <span class=\"hljs-code\">`password_hash`</span>), <span class=\"hljs-code\">`file`</span> (per <span class=\"hljs-code\">`.ssh`</span>), <span class=\"hljs-code\">`copy`</span> (per <span class=\"hljs-code\">`authorized_keys`</span>).\n\n<span class=\"hljs-section\">#### Laboratorio 3: Deploy di un’applicazione Python con virtualenv</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Obiettivo:**</span> Setup ambiente virtuale Python, installa dipendenze, avvia applicazione.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Soluzione:**</span> Playbook con <span class=\"hljs-code\">`apt`</span> (python3-venv), <span class=\"hljs-code\">`file`</span> (app<span class=\"hljs-emphasis\">_dir), `command` (venv creation), `pip`, `shell` (avvio app).\n\n## Approfondimenti Avanzati\n### Introduzione ai Moduli Avanzati di Ansible con Esempi Pratici\n#### 1. Gestione Inventario Dinamico\n- <span class=\"hljs-strong\">**Concetto:**</span> Inventario generato al volo da script, API o cloud provider.\n- <span class=\"hljs-strong\">**Perché usarlo:**</span> Automatizza reperimento host, sempre aggiornato, integra cloud/container.\n- <span class=\"hljs-strong\">**Esempio:**</span> `ansible-inventory -i ec2.py --list` o plugin nativo `aws_</span>ec2`.\n\n<span class=\"hljs-section\">#### 2. Sviluppo Moduli Personalizzati</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetto:**</span> Estendere Ansible con moduli custom quando i moduli ufficiali non bastano.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Struttura base (Python):**</span> Script con <span class=\"hljs-code\">`AnsibleModule`</span>, <span class=\"hljs-code\">`argument_spec`</span>, <span class=\"hljs-code\">`module.exit_json`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio:**</span> Modulo per gestire una risorsa fittizia (<span class=\"hljs-code\">`my_resource.py`</span>).\n\n<span class=\"hljs-section\">#### 3. Callback Plugin Avanzati</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetto:**</span> Intercettano eventi durante l'esecuzione per log personalizzati, notifiche, metriche.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Uso pratico:**</span> Notifiche Slack, log su DB esterno, output personalizzato.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio:**</span> Callback <span class=\"hljs-code\">`slack_notify.py`</span> che invia messaggi a Slack su <span class=\"hljs-code\">`v2_runner_on_ok`</span> e <span class=\"hljs-code\">`v2_runner_on_failed`</span>.\n\n<span class=\"hljs-section\">#### 4. Template Avanzati e Filtri Jinja2</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetto:**</span> Motore Jinja2 per contenuti dinamici; creare filtri personalizzati per manipolare dati complessi.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Filtri utili:**</span> <span class=\"hljs-code\">`default`</span>, <span class=\"hljs-code\">`join`</span>, <span class=\"hljs-code\">`upper`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Controlli di flusso Jinja:**</span> <span class=\"hljs-code\">`{% if ... %}`</span>, <span class=\"hljs-code\">`{% for ... %}`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio:**</span> Filtro Python <span class=\"hljs-code\">`reverse_string`</span> per <span class=\"hljs-code\">`{{ \"ciao\" | reverse }}`</span>.\n\n<span class=\"hljs-section\">#### 5. Gestione Errori e Retry</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetto:**</span> Meccanismi dichiarativi per gestire errori e tentare retry.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**`retries` e `delay`:**</span> Riprova task in caso di fallimento.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**`block` e `rescue`:**</span> Meccanismo simile a try/catch per gestire blocchi di task.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio:**</span> <span class=\"hljs-code\">`block: - command: /bin/false`</span> con <span class=\"hljs-code\">`rescue: - debug: msg: \"Comando fallito\"`</span>\n\n<span class=\"hljs-section\">#### 6. Integrazione CI/CD (GitHub Actions / OpenTofu)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Concetto:**</span> Eseguire playbook Ansible automaticamente in pipeline di integrazione continua.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio GitHub Actions:**</span> <span class=\"hljs-code\">`uses: dawidd6/action-ansible-playbook@v2`</span>.\n\n<span class=\"hljs-section\">### Plugin in Ansible — Focus su Callback Plugin e oltre</span>\n<span class=\"hljs-section\">#### 1. Introduzione ai Plugin</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Descrizione:**</span> Sistema di estensione per personalizzare il comportamento di Ansible.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Tipi Principali:**</span> Callback, Connection, Lookup, Filter, Strategy, Action.\n\n<span class=\"hljs-section\">#### 2. Focus: Callback Plugin</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Cosa sono:**</span> Intercettano eventi runtime per logging, notifiche, statistiche.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Dove si trovano:**</span> <span class=\"hljs-code\">`ansible/plugins/callback/`</span> o <span class=\"hljs-code\">`callback_plugins/`</span> nel progetto.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Come scrivere un plugin (minimo):**</span>\n<span class=\"hljs-bullet\">  -</span> Python class <span class=\"hljs-code\">`CallbackModule(CallbackBase)`</span>.\n<span class=\"hljs-bullet\">  -</span> Implementa metodi come <span class=\"hljs-code\">`v2_runner_on_ok`</span>, <span class=\"hljs-code\">`v2_runner_on_failed`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Eventi utili da intercettare:**</span> <span class=\"hljs-code\">`v2_playbook_on_start`</span>, <span class=\"hljs-code\">`v2_runner_on_ok`</span>, <span class=\"hljs-code\">`v2_runner_on_failed`</span>, <span class=\"hljs-code\">`v2_playbook_on_stats`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esempio pratico: Notifiche Slack (`slack<span class=\"hljs-emphasis\">_notify.py`)**\n  - Invia messaggi Slack su task OK/FAIL.\n  - **Installazione/Attivazione:** Copia in `callback_</span>plugins/`, configura `ansible.cfg` (`stdout<span class=\"hljs-emphasis\">_callback = slack_</span>notify`).\n- **</span>Esempio avanzato: Logging su file (<span class=\"hljs-code\">`file_logger.py`</span>)**\n<span class=\"hljs-bullet\">  -</span> Utilizza il modulo <span class=\"hljs-code\">`logging`</span> di Python.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizi consigliati:**</span> Callback per email, Filter per maiuscolo, Lookup da JSON.\n\n<span class=\"hljs-section\">#### 7. Altri Plugin: Brevi Cenni</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Filter Plugin:**</span> Estensioni di filtri Jinja2 per manipolare dati.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Lookup Plugin:**</span> Caricare dati da fonti esterne (file, database, API).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Connection Plugin:**</span> Definire nuovi metodi di connessione (SSH, local, Docker, REST API).\n\n<span class=\"hljs-section\">### Esempi Completii per Altri Tipi di Plugin</span>\n<span class=\"hljs-section\">#### 1. Filter Plugin (`filter<span class=\"hljs-emphasis\">_plugins/camelcase.py`)\n- <span class=\"hljs-strong\">**Filtro:**</span> `camelcase`\n- <span class=\"hljs-strong\">**Funzione:**</span> Converte una stringa in camelCase.\n- <span class=\"hljs-strong\">**Uso:**</span> `{{ \"ciao mondo\" | camelcase }}` -&gt; `\"ciaoMondo\"`\n\n#### 2. Lookup Plugin (`lookup_</span>plugins/httpjson.py`)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Lookup:**</span> <span class=\"hljs-code\">`httpjson`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Funzione:**</span> Carica dati JSON da una URL HTTP.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Uso:**</span> <span class=\"hljs-code\">`{{ lookup('httpjson', 'https://api.example.com/data.json') }}`</span>\n\n<span class=\"hljs-section\">#### 3. Connection Plugin (`connection<span class=\"hljs-emphasis\">_plugins/restapi.py`)\n- <span class=\"hljs-strong\">**Plugin:**</span> `restapi`\n- <span class=\"hljs-strong\">**Funzione:**</span> Esempio base di connessione ad un host tramite API REST.\n- <span class=\"hljs-strong\">**Uso:**</span> `ansible_</span>connection: restapi` in inventory con `ansible<span class=\"hljs-emphasis\">_remote_</span>addr`.</span>\n\n<span class=\"hljs-section\">### Moduli personalizzati vs Plugin Ansible (Confronto Dettagliato)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Moduli Personalizzati:**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Scopo:**</span> Eseguire task specifici (nuova azione, gestione risorse, interagire con API proprietarie).\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Invocazione:**</span> Direttamente dal playbook come task.\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Caratteristiche:**</span> Autonomo, riutilizzabile, idempotente, restituito stato JSON.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Plugin Ansible:**</span>\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Scopo:**</span> Estendere o modificare il comportamento interno di Ansible (funzionalità di supporto o hook).\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Invocazione:**</span> Interni ad Ansible, non task diretti.\n<span class=\"hljs-bullet\">  -</span> <span class=\"hljs-strong\">**Caratteristiche:**</span> Integrati nel core, specifici per il loro tipo (callback, filter, lookup, etc.).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Confronto Diretto (Tabella):**</span> Aspetti come Scopo, Invocazione, Tipi, Livello di impatto, Idempotenza, Linguaggio.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Sintesi:**</span> Moduli per <span class=\"hljs-emphasis\">*nuove azioni*</span>, Plugin per <span class=\"hljs-emphasis\">*estendere il motore Ansible*</span>.\n\n<span class=\"hljs-section\">### Esempi Pratici su Moduli e Plugin</span>\n<span class=\"hljs-section\">#### 1. Modulo personalizzato: Esempio completo (`library/my<span class=\"hljs-emphasis\">_resource.py`)\n- Gestisce `name` e `state` per una \"risorsa fittizia\".\n- Include `supports_</span>check<span class=\"hljs-emphasis\">_mode=True`.\n- <span class=\"hljs-strong\">**Uso Playbook:**</span> `- name: Gestisci la risorsa fittizia my_</span>resource: name: \"esempio1\" state: present`</span>\n\n<span class=\"hljs-section\">#### 2. Plugin callback: Esempio base di logging task (`callback<span class=\"hljs-emphasis\">_plugins/simple_</span>logger.py`)</span>\n<span class=\"hljs-bullet\">-</span> Stampa <span class=\"hljs-code\">`[INFO] TASK OK`</span> ogni volta che un task termina con successo.\n\n<span class=\"hljs-section\">#### 3. Filter plugin: Esempio di filtro per stringhe (`filter<span class=\"hljs-emphasis\">_plugins/my_</span>filters.py`)</span>\n<span class=\"hljs-bullet\">-</span> Filtro <span class=\"hljs-code\">`shout`</span> per trasformare testo in maiuscolo con esclamazioni.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Uso Jinja2:**</span> <span class=\"hljs-code\">`Messaggio: {{ \"ciao mondo\" | shout }}`</span>\n\n<span class=\"hljs-section\">#### 4. Lookup plugin: Esempio per leggere dati da file esterno (`lookup<span class=\"hljs-emphasis\">_plugins/my_</span>lookup.py`)</span>\n<span class=\"hljs-bullet\">-</span> Legge e restituisce il contenuto di un file di testo.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Uso Playbook:**</span> <span class=\"hljs-code\">`debug: msg: \"{{ lookup('my_lookup', 'file.txt') }}\"`</span>\n\n<span class=\"hljs-section\">#### 5. Connection plugin: Esempio base (più avanzato, opzionale)</span>\n<span class=\"hljs-bullet\">-</span> Nota che la definizione è complessa e dipende dal caso d'uso.\n\n<span class=\"hljs-section\">#### 6. Sintesi e Suggerimenti</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Decision:**</span> Usare moduli per azioni, plugin per estendere il funzionamento di Ansible.\n<span class=\"hljs-bullet\">-</span> Mantenere idempotenza e chiarezza nel playbook.\n<span class=\"hljs-bullet\">-</span> Usare la struttura di directory standard per il caricamento automatico.\n\n<span class=\"hljs-section\">## Mini Progetto Demo Completo (Integrazione di Moduli e Plugin)</span>\n<span class=\"hljs-section\">### Struttura del Progetto (`ansible-declarative-demo/`)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`library/my_resource.py`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`callback_plugins/simple_logger.py`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`filter_plugins/my_filters.py`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`lookup_plugins/my_lookup.py`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`playbook.yml`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`README.md`</span>\n\n<span class=\"hljs-section\">### `playbook.yml`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Tasks:**</span>\n<span class=\"hljs-bullet\">  -</span> Usa modulo <span class=\"hljs-code\">`my_resource`</span> per creare \"demo<span class=\"hljs-emphasis\">_resource\".\n  - Usa filtro `shout` con variabile `message`.\n  - Usa lookup `my_</span>lookup<span class=\"hljs-code\">` per leggere `</span>demo.txt`.\n\n<span class=\"hljs-section\">### `README.md`</span>\n<span class=\"hljs-bullet\">-</span> Obiettivi, struttura, istruzioni (creare <span class=\"hljs-code\">`demo.txt`</span>, eseguire <span class=\"hljs-code\">`ansible-playbook -v playbook.yml`</span>), requisiti, note sul caricamento plugin.\n\n<span class=\"hljs-section\">## Guida Didattica per il Progetto Demo</span>\n<span class=\"hljs-section\">### Capitolo 1: Introduzione al progetto e setup</span>\n<span class=\"hljs-bullet\">-</span> Setup <span class=\"hljs-code\">`demo.txt`</span>, esegui <span class=\"hljs-code\">`ansible-playbook -v playbook.yml`</span>.\n<span class=\"hljs-bullet\">-</span> Osserva l'output del modulo, filtro, lookup e callback.\n<span class=\"hljs-section\">### Capitolo 2: Moduli personalizzati</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Focus:**</span> <span class=\"hljs-code\">`my_resource.py`</span>, parametri, check mode, <span class=\"hljs-code\">`changed`</span> flag.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio:**</span> Modifica per accettare <span class=\"hljs-code\">`description`</span> opzionale.\n<span class=\"hljs-section\">### Capitolo 3: Callback plugin</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Focus:**</span> <span class=\"hljs-code\">`simple_logger.py`</span>, <span class=\"hljs-code\">`runner_on_ok`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio:**</span> Aggiungi gestione <span class=\"hljs-code\">`runner_on_failed`</span>.\n<span class=\"hljs-section\">### Capitolo 4: Filter plugin</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Focus:**</span> <span class=\"hljs-code\">`my_filters.py`</span>, filtro <span class=\"hljs-code\">`shout`</span>.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio:**</span> Implementa filtro <span class=\"hljs-code\">`repeat(string, num)`</span>.\n<span class=\"hljs-section\">### Capitolo 5: Lookup plugin</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Focus:**</span> <span class=\"hljs-code\">`my_lookup.py`</span>, leggere file.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio:**</span> Modifica per accettare parametro <span class=\"hljs-code\">`lines`</span>.\n<span class=\"hljs-section\">### Capitolo 6: Integrazione e test</span>\n<span class=\"hljs-bullet\">-</span> Combina filtri e lookup.\n<span class=\"hljs-bullet\">-</span> Esegui modulo in check mode.\n<span class=\"hljs-bullet\">-</span> Osserva messaggi del callback.\n<span class=\"hljs-section\">### Capitolo 7: Esercizi avanzati</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio 1:**</span> Modulo per file temporanei con contenuti dinamici.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio 2:**</span> Callback plugin per log JSON strutturato.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio 3:**</span> Filtro per formattare date.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Esercizio 4:**</span> Lookup plugin che interroga un’API REST.\n</code></pre>","children":[]},null)</script>

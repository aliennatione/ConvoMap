+= i</code>.","children":[],"payload":{"lines":"189,190"}},{"content":"Esempio Dichiarativo (Ansible): <code>debug: msg: \"{{ range(1,11) | sum }}\"</code>.","children":[],"payload":{"lines":"190,191"}}],"payload":{"lines":"188,191"}},{"content":"<strong>Perché imparare con Ansible?</strong> (Linguaggio dichiarativo, automazione, YAML leggibile, concetti base).","children":[],"payload":{"lines":"191,192"}},{"content":"<strong>Struttura di un Playbook Ansible:</strong> <code>hosts</code>, <code>tasks</code>, <code>vars</code>.","children":[{"content":"Esempio base:","children":[],"payload":{"lines":"193,194"}}],"payload":{"lines":"192,201"}},{"content":"<strong>Obiettivi del tutorial:</strong> Apprendere variabili, condizioni, cicli, moduli; comprendere paradigmi; costruire playbook riutilizzabili; confrontare con Python.","children":[],"payload":{"lines":"201,203"}}],"payload":{"lines":"187,188"}},{"content":"Chapter 2: Variabili in Ansible","children":[{"content":"<strong>Cos'è una Variabile?</strong> Contenitore di valori.","children":[],"payload":{"lines":"204,205"}},{"content":"<strong>Definire Variabili:</strong> Sezione <code>vars:</code>.<pre><code class=\"language-yaml\"><span class=\"hljs-attr\">vars:</span>\n  <span class=\"hljs-attr\">nome:</span> <span class=\"hljs-string\">\"Mario\"</span>\n  <span class=\"hljs-attr\">eta:</span> <span class=\"hljs-number\">30</span>\n  <span class=\"hljs-attr\">hobbies:</span>\n    <span class=\"hljs-bullet\">-</span> <span class=\"hljs-string\">calcio</span>\n    <span class=\"hljs-bullet\">-</span> <span class=\"hljs-string\">musica</span>\n</code></pre>","children":[],"payload":{"lines":"205,214"}},{"content":"<strong>Usare Variabili:</strong> Sintassi <code>{{ variabile }}</code>.","children":[],"payload":{"lines":"214,215"}},{"content":"<strong>Tipi di Variabili:</strong> Numeri, Stringhe, Liste, Dizionari.","children":[],"payload":{"lines":"215,216"}},{"content":"<strong>Esempio Completo</strong> (Ansible &amp; Python comparison).","children":[],"payload":{"lines":"216,217"}},{"content":"<strong>Note:</strong> Variabili sono immutabili nel contesto di un playbook.","children":[],"payload":{"lines":"217,219"}}],"payload":{"lines":"203,204"}},{"content":"Chapter 3: Condizioni con <code>when</code>","children":[{"content":"<strong>Perché servono le condizioni?</strong> Eseguire azioni solo se una condizione è vera.","children":[],"payload":{"lines":"220,221"}},{"content":"<strong>Sintassi base:</strong><pre><code class=\"language-yaml\"><span class=\"hljs-attr\">tasks:</span>\n  <span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">Esegui</span> <span class=\"hljs-string\">solo</span> <span class=\"hljs-string\">se</span> <span class=\"hljs-string\">x</span> <span class=\"hljs-string\">è</span> <span class=\"hljs-string\">maggiore</span> <span class=\"hljs-string\">di</span> <span class=\"hljs-number\">10</span>\n    <span class=\"hljs-attr\">debug:</span>\n      <span class=\"hljs-attr\">msg:</span> <span class=\"hljs-string\">\"x è grande!\"</span>\n    <span class=\"hljs-attr\">when:</span> <span class=\"hljs-string\">x</span> <span class=\"hljs-string\">&gt;</span> <span class=\"hljs-number\">10</span>\n</code></pre>","children":[],"payload":{"lines":"221,229"}},{"content":"<strong>Esempio completo</strong> (Ansible &amp; Python comparison).","children":[],"payload":{"lines":"229,230"}},{"content":"<strong>Operatori supportati:</strong> <code>==</code>, <code>!=</code>, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>, <code>and</code>, <code>or</code>, <code>not</code>.","children":[],"payload":{"lines":"230,231"}},{"content":"<strong>Nota:</strong> <code>when</code> è un filtro Jinja2.","children":[],"payload":{"lines":"231,233"}}],"payload":{"lines":"219,220"}},{"content":"Chapter 4: Cicli con <code>loop</code>","children":[{"content":"<strong>Cos'è un ciclo?</strong> Ripete un’azione più volte per ogni elemento di una lista o intervallo.","children":[],"payload":{"lines":"234,235"}},{"content":"<strong>Sintassi base con <code>loop</code>:</strong><pre><code class=\"language-yaml\"><span class=\"hljs-attr\">tasks:</span>\n  <span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">Saluta</span> <span class=\"hljs-string\">utenti</span>\n    <span class=\"hljs-attr\">debug:</span>\n      <span class=\"hljs-attr\">msg:</span> <span class=\"hljs-string\">\"Ciao <span class=\"hljs-template-variable\">{{ item }}</span>\"</span>\n    <span class=\"hljs-attr\">loop:</span>\n      <span class=\"hljs-bullet\">-</span> <span class=\"hljs-string\">Mario</span>\n      <span class=\"hljs-bullet\">-</span> <span class=\"hljs-string\">Lucia</span>\n      <span class=\"hljs-bullet\">-</span> <span class=\"hljs-string\">Anna</span>\n</code></pre>","children":[],"payload":{"lines":"235,246"}},{"content":"<strong>Variabili nella lista:</strong> <code>item</code> contiene l’elemento corrente.","children":[],"payload":{"lines":"246,247"}},{"content":"<strong>Esempio completo</strong> (Ansible &amp; Python comparison).","children":[],"payload":{"lines":"247,248"}},{"content":"<strong>Loop con indici:</strong> <code>loop: \"{{ range(1,6) | list }}\"</code>.","children":[],"payload":{"lines":"248,249"}},{"content":"<strong>Nota:</strong> <code>loop</code> in Ansible è più limitato rispetto a Python.","children":[],"payload":{"lines":"249,251"}}],"payload":{"lines":"233,234"}},{"content":"Chapter 5: Modularità con Ruoli","children":[{"content":"<strong>Perché modularizzare?</strong> Organizzare playbook complessi in parti riutilizzabili.","children":[],"payload":{"lines":"252,253"}},{"content":"<strong>Struttura di un ruolo:</strong> <code>roles/mio_ruolo/{tasks/main.yml, vars/main.yml, README.md}</code>.","children":[],"payload":{"lines":"253,254"}},{"content":"<strong>Come usare un ruolo:</strong> Nel playbook, <code>roles: - mio_ruolo</code>.","children":[],"payload":{"lines":"254,255"}},{"content":"<strong>Esempio ruolo <code>saluto</code></strong> (<code>roles/saluto/tasks/main.yml</code> e playbook che lo usa).","children":[],"payload":{"lines":"255,256"}},{"content":"<strong>Vantaggi:</strong> Riutilizzo, separazione di responsabilità, facilità di manutenzione.","children":[],"payload":{"lines":"256,257"}},{"content":"<strong>Nota:</strong> Puoi passare variabili al ruolo.","children":[],"payload":{"lines":"257,259"}}],"payload":{"lines":"251,252"}}],"payload":{"lines":"186,187"}},{"content":"Advanced Ansible Features &amp; Error Handling","children":[{"content":"Chapter 6: Gestione Errori e Controllo del Flusso","children":[{"content":"<strong>Perché gestire errori?</strong> Per non interrompere l'intera esecuzione.","children":[],"payload":{"lines":"261,262"}},{"content":"<strong>Controllo errori con <code>ignore_errors</code>:</strong><pre><code class=\"language-yaml\"><span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">Esegue</span> <span class=\"hljs-string\">un</span> <span class=\"hljs-string\">comando</span> <span class=\"hljs-string\">che</span> <span class=\"hljs-string\">potrebbe</span> <span class=\"hljs-string\">fallire</span>\n  <span class=\"hljs-attr\">command:</span> <span class=\"hljs-string\">/bin/false</span>\n  <span class=\"hljs-attr\">ignore_errors:</span> <span class=\"hljs-literal\">yes</span>\n</code></pre>","children":[],"payload":{"lines":"262,268"}},{"content":"<strong>Condizione di successo con <code>failed_when</code> e <code>changed_when</code>:</strong> Personalizzare la valutazione di fallimento o cambiamento.","children":[],"payload":{"lines":"268,269"}},{"content":"<strong>Blocchi e <code>rescue</code>:</strong> Raggruppare task e gestire errori (simil try/catch).<pre><code class=\"language-yaml\"><span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">block:</span>\n    <span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">Task</span> <span class=\"hljs-string\">che</span> <span class=\"hljs-string\">potrebbe</span> <span class=\"hljs-string\">fallire</span>\n      <span class=\"hljs-attr\">command:</span> <span class=\"hljs-string\">/bin/false</span>\n  <span class=\"hljs-attr\">rescue:</span>\n    <span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">Gestione</span> <span class=\"hljs-string\">errore</span>\n      <span class=\"hljs-attr\">debug: msg:</span> <span class=\"hljs-string\">\"Errore catturato\"</span>\n</code></pre>","children":[],"payload":{"lines":"269,278"}},{"content":"<strong>Condizione <code>when</code> per controllare flussi:</strong> Saltare task basati sul risultato di task precedenti (<code>register</code>).","children":[],"payload":{"lines":"278,279"}},{"content":"<strong>Confronto Python (<code>try/except</code>)</strong>.","children":[],"payload":{"lines":"279,280"}},{"content":"<strong>Note:</strong> Cruciale in automazione per non lasciare ambienti in stato incerto.","children":[],"payload":{"lines":"280,282"}}],"payload":{"lines":"260,261"}},{"content":"Chapter 7: Template Jinja2 in Ansible","children":[{"content":"<strong>Cos'è Jinja2?</strong> Motore di template per generare contenuti dinamici.","children":[],"payload":{"lines":"283,284"}},{"content":"<strong>Uso nei file template <code>.j2</code>:</strong><pre><code class=\"language-jinja\"><span class=\"language-xml\">server { listen 80; server_name </span><span class=\"hljs-template-variable\">{{ hostname }}</span><span class=\"language-xml\">; }\n</span></code></pre>","children":[],"payload":{"lines":"284,288"}},{"content":"<strong>Uso nel playbook:</strong> <code>template: src: template.conf.j2 dest: /etc/nginx/sites-enabled/default</code>.","children":[],"payload":{"lines":"288,289"}},{"content":"<strong>Variabili, filtri e controllo flusso:</strong> <code>{{ var }}</code>, <code>{{ var | lower }}</code>, <code>{% if condition %} ... {% endif %}</code>.","children":[],"payload":{"lines":"289,290"}},{"content":"<strong>Confronto con Python:</strong> Simile a string formatting ma più potente.","children":[],"payload":{"lines":"290,291"}},{"content":"<strong>Note:</strong> Utili per generare file di configurazione, script o documenti dinamici.","children":[],"payload":{"lines":"291,293"}}],"payload":{"lines":"282,283"}},{"content":"Chapter 8: Callback Plugin e Personalizzazioni","children":[{"content":"<strong>Cosa sono i callback plugin?</strong> Eseguire azioni personalizzate durante o dopo l’esecuzione dei playbook (log, notifiche).","children":[],"payload":{"lines":"294,295"}},{"content":"<strong>Uso base:</strong> <code>export ANSIBLE_CALLBACK_WHITELIST='json'</code>.","children":[],"payload":{"lines":"295,296"}},{"content":"<strong>Scrivere un callback personalizzato:</strong> File Python che definisce metodi come <code>v2_runner_on_ok</code>.","children":[],"payload":{"lines":"296,297"}},{"content":"<strong>Perché usarlo?</strong> Monitoraggio, integrazione con sistemi esterni, logging avanzato.","children":[],"payload":{"lines":"297,298"}},{"content":"<strong>Alternative:</strong> Moduli di output.","children":[],"payload":{"lines":"298,299"}},{"content":"<strong>Note:</strong> Richiede Python e conoscenza Ansible internals.","children":[],"payload":{"lines":"299,301"}}],"payload":{"lines":"293,294"}},{"content":"Chapter 11: Gestione avanzata variabili e facts","children":[{"content":"<strong>Introduzione:</strong> Variabili da file, inventario, ruoli, facts, CLI.","children":[],"payload":{"lines":"302,303"}},{"content":"<strong>Ordine di precedenza variabili:</strong> Extra vars &gt; Playbook/Role vars &gt; Inventory vars &gt; Facts &gt; Defaults.","children":[],"payload":{"lines":"303,304"}},{"content":"<strong>Uso dei Facts:</strong> Informazioni raccolte dal target tramite <code>setup</code> module (<code>ansible_hostname</code>, <code>ansible_os_family</code>).","children":[],"payload":{"lines":"304,305"}},{"content":"<strong>Accesso ai facts:</strong> <code>{{ ansible_facts.ansible_hostname }}</code>.","children":[],"payload":{"lines":"305,306"}},{"content":"<strong>Variabili complesse:</strong> Strutturate (dizionari, liste), iterare su liste.","children":[],"payload":{"lines":"306,307"}},{"content":"<strong>Variabili dinamiche con <code>set_fact</code>:</strong> Definire variabili a runtime.","children":[],"payload":{"lines":"307,308"}},{"content":"<strong>Gestione scope variabili:</strong> Variabili di ruolo isolate, di playbook visibili a tutto il play.","children":[],"payload":{"lines":"308,309"}},{"content":"<strong>Esercizio:</strong> Playbook con facts per OS Ubuntu, <code>set_fact</code> per valore dinamico.","children":[],"payload":{"lines":"309,311"}}],"payload":{"lines":"301,302"}},{"content":"Chapter 12: Strategie di deployment avanzate","children":[{"content":"<strong>Introduzione:</strong> Minimizzare downtime, gestire rollback, assicurare coerenza.","children":[],"payload":{"lines":"312,313"}},{"content":"<strong>Strategie comuni:</strong>","children":[{"content":"<strong>Rolling Update:</strong> Aggiorna nodi uno alla volta (<code>serial: 1</code>).","children":[],"payload":{"lines":"314,315"}},{"content":"<strong>Blue/Green Deployment:</strong> Gestibile con orchestration esterna.","children":[],"payload":{"lines":"315,316"}}],"payload":{"lines":"313,316"}},{"content":"<strong>Gestione rollback:</strong> Usare <code>block</code> e <code>rescue</code> per rollback in caso di fallimenti.","children":[],"payload":{"lines":"316,317"}},{"content":"<strong>Uso di tags:</strong> Eseguire solo parti del playbook (<code>ansible-playbook --tags \"deploy\"</code>).","children":[],"payload":{"lines":"317,318"}},{"content":"<strong>Gestione segreti:</strong> Integrare con Ansible Vault.","children":[],"payload":{"lines":"318,319"}},{"content":"<strong>Esercizio:</strong> Playbook con rolling update e gestione rollback.","children":[],"payload":{"lines":"319,321"}}],"payload":{"lines":"311,312"}}],"payload":{"lines":"259,260"}},{"content":"Practical Application: Labs &amp; Real-World Examples","children":[{"content":"Esempi Pratici e Esercizi","children":[{"content":"<strong>Esempio pratico 1: Installare e configurare Nginx con template</strong>","children":[{"content":"Playbook: Install Nginx, copy <code>nginx.conf.j2</code> template, notify <code>restart nginx</code> handler.","children":[],"payload":{"lines":"324,325"}}],"payload":{"lines":"323,325"}},{"content":"<strong>Esercizio 1:</strong> Scrivi un playbook che crea un utente con un gruppo specifico, usando variabili e condizioni.","children":[],"payload":{"lines":"325,326"}},{"content":"<strong>Esempio pratico 2: Gestione errori con block e rescue</strong>","children":[{"content":"Playbook: <code>block</code> containing a failing command, <code>rescue</code> to handle the failure.","children":[],"payload":{"lines":"327,328"}}],"payload":{"lines":"326,328"}},{"content":"<strong>Esercizio 2:</strong> Modifica l’esempio sopra per registrare l’output del comando fallito e usarlo nel rescue.","children":[],"payload":{"lines":"328,330"}}],"payload":{"lines":"322,323"}},{"content":"Laboratori Pratici con Soluzioni","children":[{"content":"<strong>Laboratorio 1: Installare Docker e Nginx container</strong>","children":[{"content":"<strong>Obiettivo:</strong> Installa Docker, aggiunge utente al gruppo docker, avvia un container nginx.","children":[],"payload":{"lines":"332,333"}},{"content":"<strong>Soluzione:</strong> Playbook che usa <code>apt</code>, <code>apt_key</code>, <code>apt_repository</code>, <code>user</code>, <code>docker_container</code>.","children":[],"payload":{"lines":"333,334"}}],"payload":{"lines":"331,334"}},{"content":"<strong>Laboratorio 2: Gestione utenti e gruppi</strong>","children":[{"content":"<strong>Obiettivo:</strong> Crea playbook che aggiunge utenti con gruppi specifici, password criptate, e configura SSH.","children":[],"payload":{"lines":"335,336"}},{"content":"<strong>Soluzione:</strong> Playbook con <code>group</code>, <code>user</code> (con <code>password_hash</code>), <code>file</code> per <code>.ssh</code>, <code>copy</code> per <code>authorized_keys</code>.","children":[],"payload":{"lines":"336,337"}}],"payload":{"lines":"334,337"}},{"content":"<strong>Laboratorio 3: Deploy di un’applicazione Python con virtualenv</strong>","children":[{"content":"<strong>Obiettivo:</strong> Setup ambiente virtuale Python, installa dipendenze, avvia applicazione.","children":[],"payload":{"lines":"338,339"}},{"content":"<strong>Soluzione:</strong> Playbook con <code>apt</code> per Python, <code>file</code> per app dir, <code>command</code> per venv, <code>pip</code> per requirements, <code>shell</code> per avvio app.","children":[],"payload":{"lines":"339,341"}}],"payload":{"lines":"337,341"}}],"payload":{"lines":"330,331"}}],"payload":{"lines":"321,322"}},{"content":"Extending Ansible: Custom Modules &amp; Plugins","children":[{"content":"Chapter: Plugin in Ansible — Focus su Callback Plugin e oltre","children":[{"content":"<strong>1. Introduzione ai Plugin in Ansible:</strong> Ansible è altamente estensibile.","children":[{"content":"<strong>Tipologie principali di plugin:</strong> Callback, Connection, Lookup, Filter, Strategy, Action (con descrizioni ed esempi).","children":[],"payload":{"lines":"344,345"}}],"payload":{"lines":"343,345"}},{"content":"<strong>2. Focus: Callback Plugin:</strong>","children":[{"content":"<strong>2.1 Cosa sono i Callback Plugin?</strong> Intercettano eventi durante l’esecuzione per log, notifiche, metriche.","children":[],"payload":{"lines":"346,347"}},{"content":"<strong>2.2 Dove si trovano i callback plugin?</strong> <code>/usr/lib/python3.x/...</code> o localmente in <code>./callback_plugins/</code>.","children":[],"payload":{"lines":"347,348"}}],"payload":{"lines":"345,348"}},{"content":"<strong>3. Come scrivere un Callback Plugin personalizzato:</strong>","children":[{"content":"<strong>3.1 Struttura minima:</strong> <code>CallbackModule(CallbackBase)</code>, metodi <code>v2_runner_on_ok</code>, <code>v2_runner_on_failed</code>.","children":[],"payload":{"lines":"349,350"}},{"content":"<strong>3.2 Eventi utili:</strong> <code>v2_playbook_on_start</code>, <code>v2_runner_on_ok</code>, <code>v2_runner_on_failed</code>, <code>v2_playbook_on_stats</code>.","children":[],"payload":{"lines":"350,351"}}],"payload":{"lines":"348,351"}},{"content":"<strong>4. Esempio pratico: Callback per notifiche Slack:</strong> Python code for <code>slack_notify.py</code> using <code>requests</code>.","children":[],"payload":{"lines":"351,352"}},{"content":"<strong>5. Installazione e attivazione:</strong> Copia in <code>callback_plugins/</code>, configura <code>ansible.cfg</code> (<code>stdout_callback = slack_notify</code>).","children":[],"payload":{"lines":"352,353"}},{"content":"<strong>6. Esempio avanzato: Callback plugin con logging su file:</strong> Python code for <code>file_logger.py</code> using <code>logging</code>.","children":[],"payload":{"lines":"353,354"}},{"content":"<strong>7. Altri plugin: brevi cenni:</strong> Filter, Lookup, Connection.","children":[],"payload":{"lines":"354,355"}},{"content":"<strong>8. Esercizi consigliati:</strong> Notifiche email, filtro uppercase, lookup JSON.","children":[],"payload":{"lines":"355,357"}}],"payload":{"lines":"342,343"}},{"content":"Distinction: Custom Modules vs. Ansible Plugins","children":[{"content":"<strong>1. Moduli personalizzati:</strong>","children":[{"content":"<strong>Cos’è un modulo?</strong> Unità base di lavoro, script che esegue un’azione specifica, invocato da un task.","children":[],"payload":{"lines":"359,360"}},{"content":"<strong>Quando si usano?</strong> Per definire nuove azioni o gestione risorse non native.","children":[],"payload":{"lines":"360,361"}},{"content":"<strong>Caratteristiche:</strong> Autonomo, riutilizzabile, idempotente, tipicamente Python.","children":[],"payload":{"lines":"361,362"}},{"content":"<strong>Esempio minimo:</strong> Python module with <code>AnsibleModule</code> and <code>exit_json</code>.","children":[],"payload":{"lines":"362,363"}}],"payload":{"lines":"358,363"}},{"content":"<strong>2. Plugin Ansible:</strong>","children":[{"content":"<strong>Cos’è un plugin?</strong> Componente estensibile che modifica o estende il comportamento interno di Ansible. Funzionalità di supporto o hook.","children":[],"payload":{"lines":"364,365"}},{"content":"<strong>Quando si usano?</strong> Per personalizzare l’ambiente di esecuzione, aggiungere funzionalità cross-cutting.","children":[],"payload":{"lines":"365,366"}},{"content":"<strong>Caratteristiche:</strong> Integrati nel core, specifici, Python, influenzano il runtime.","children":[],"payload":{"lines":"366,367"}},{"content":"<strong>Esempio semplice:</strong> Callback plugin <code>simple_log.py</code>.","children":[],"payload":{"lines":"367,368"}}],"payload":{"lines":"363,368"}},{"content":"<strong>3. Confronto diretto:</strong> Tabella comparativa (Scope, Invocazione, Tipi, Impatto, Idempotenza, Esempi, Linguaggio).","children":[],"payload":{"lines":"368,369"}},{"content":"<strong>4. Sintesi:</strong> Moduli per <strong>azioni</strong>, plugin per <strong>estendere il motore Ansible</strong>.","children":[],"payload":{"lines":"369,371"}}],"payload":{"lines":"357,358"}},{"content":"Full Examples for other Plugin Types","children":[{"content":"<strong>1. Filter Plugin:</strong>","children":[{"content":"Python Code: <code>filter_plugins/camelcase.py</code> (converts string to camelCase).","children":[],"payload":{"lines":"373,374"}},{"content":"Usage: <code>{{ \"ciao mondo\" | camelcase }}</code>.","children":[],"payload":{"lines":"374,375"}}],"payload":{"lines":"372,375"}},{"content":"<strong>2. Lookup Plugin:</strong>","children":[{"content":"Python Code: <code>lookup_plugins/httpjson.py</code> (fetches JSON from HTTP URL using <code>requests</code>).","children":[],"payload":{"lines":"376,377"}},{"content":"Usage: <code>{{ lookup('httpjson', 'https://api.example.com/data.json') }}</code>.","children":[],"payload":{"lines":"377,378"}}],"payload":{"lines":"375,378"}},{"content":"<strong>3. Connection Plugin:</strong>","children":[{"content":"Python Code: <code>connection_plugins/restapi.py</code> (fictional REST API connection using <code>requests</code>).","children":[],"payload":{"lines":"379,380"}},{"content":"Usage: Inventory <code>ansible_connection=restapi ansible_remote_addr=https://api.example.com</code>.","children":[],"payload":{"lines":"380,382"}}],"payload":{"lines":"378,382"}}],"payload":{"lines":"371,372"}},{"content":"Practical Integration: Custom Modules &amp; Plugins","children":[{"content":"<strong>1. Moduli personalizzati: esempio completo e commentato</strong>","children":[{"content":"File: <code>library/my_resource.py</code> (simula creazione/rimozione risorsa, supporta <code>check_mode</code>).","children":[],"payload":{"lines":"384,385"}},{"content":"Usage in playbook: <code>my_resource: name: \"esempio1\" state: present</code>.","children":[],"payload":{"lines":"385,386"}}],"payload":{"lines":"383,386"}},{"content":"<strong>2. Plugin callback: esempio base di logging task</strong>","children":[{"content":"File: <code>callback_plugins/simple_logger.py</code> (stampa INFO su <code>v2_runner_on_ok</code>).","children":[],"payload":{"lines":"387,388"}}],"payload":{"lines":"386,388"}},{"content":"<strong>3. Filter plugin: esempio di filtro personalizzato per manipolare stringhe</strong>","children":[{"content":"File: <code>filter_plugins/my_filters.py</code> (<code>shout</code> filter: uppercase + \"!!!\").","children":[],"payload":{"lines":"389,390"}},{"content":"Usage in Jinja2 template: <code>Messaggio: {{ \"ciao mondo\" | shout }}</code>.","children":[],"payload":{"lines":"390,391"}}],"payload":{"lines":"388,391"}},{"c

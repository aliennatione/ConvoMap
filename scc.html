    legend.style.cssText="position:fixed;top:12px;left:12px;background:rgba(255,255,255,.95);padding:10px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);font:13px sans-serif;z-index:9999;display:none";
    legend.innerHTML="<b>Comandi</b><br>+ zoom in<br>- zoom out<br>0 adatta<br>? legenda";
    document.body.appendChild(legend);
    document.addEventListener("keydown",function(e){
      if(e.key==="+ "||e.key==="+"){mm.rescale(1.25);}
      else if(e.key==="-"){mm.rescale(1/1.25);}
      else if(e.key==="0"){mm.fit();}
      else if(e.key==="?"){legend.style.display=legend.style.display==="none"?"block":"none";}
    });
  }
  init();
})();
</script></body>
</html>

            })(() => window.markmap,null,{"content":"<pre><code class=\"language-markdown\">---\n<span class=\"hljs-section\">mindmap\n---</span>\n<span class=\"hljs-section\"># Project: The Grand Delusion of Mr. I and Furio – Unearthing \"Fortune\"</span>\n\n<span class=\"hljs-section\">## 🎯 Project Goal: Personal Enrichment through Perceived Opportunity</span>\n\n<span class=\"hljs-section\">### 👤 Stakeholder 1: Mr. I - Character &amp; Worldview</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Initial State &amp; Worldview**</span>\n<span class=\"hljs-bullet\">    -</span> Reclusive, paranoid, uneducated, anti-intellectual\n<span class=\"hljs-bullet\">    -</span> Believes in fringe web theories (aliens, reptilians, \"powers that be\")\n<span class=\"hljs-bullet\">    -</span> Distrusts \"official\" information (newspapers, TV, experts)\n<span class=\"hljs-bullet\">    -</span> Self-perception: Warrior, man of action, defending his \"trincea\" (trench)\n<span class=\"hljs-bullet\">    -</span> Reality: Inept, infantile, lazy, relies on mother's inheritance\n<span class=\"hljs-bullet\">    -</span> Uses objects as \"friends\" (rifle, knife)\n<span class=\"hljs-bullet\">    -</span> Manias: Obsessed with \"projects\" (failed animal breeding, homemade explosives, alchemy, Japanese from anime)\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Motivations &amp; Triggers**</span>\n<span class=\"hljs-bullet\">    -</span> Paranoia: Everyone is plotting against him, wants \"his\" fortune\n<span class=\"hljs-bullet\">    -</span> Greed: Desire for the perceived \"petrol\" under his house\n<span class=\"hljs-bullet\">    -</span> Pride &amp; Resistance: Refusal to be manipulated, fight against \"change\" and \"progress\"\n<span class=\"hljs-bullet\">    -</span> Solace: Finds comfort in repetitive, simple tasks or hobbies (fishing, smoking)\n<span class=\"hljs-bullet\">    -</span> Dreams: Interprets dreams as premonitions (mother covered in black paint)\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Cognitive Processes**</span>\n<span class=\"hljs-bullet\">    -</span> Simplified logic (\"first come, first served\")\n<span class=\"hljs-bullet\">    -</span> Rejection of complex ideas (scientific explanations)\n<span class=\"hljs-bullet\">    -</span> Comfort Zone: Strict mental and physical boundaries\n\n<span class=\"hljs-section\">### 👥 Stakeholder 2: Furio - Character &amp; Alliance</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Character &amp; Worldview**</span>\n<span class=\"hljs-bullet\">    -</span> Hunchbacked, Rambo-fan, shares Mr. I's conspiracy theories\n<span class=\"hljs-bullet\">    -</span> Survivalist: Built a bunker (shop's basement) with absurd preparations (urine purifier, expired rations)\n<span class=\"hljs-bullet\">    -</span> Incompetence: Failed shooting range experience (broken clavicle)\n<span class=\"hljs-bullet\">    -</span> Shared traits with Mr. I: Stubborn, prejudiced, isolated, but sees Mr. I as an \"apprentice\"\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Alliance Formation**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Decision:**</span> Forms alliance with Mr. I based on shared paranoia and belief in \"petrol.\"\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Motivation:**</span> Feels \"paladin\" authority, hopes for an apocalypse to validate his preparations.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Contribution:**</span> Source of \"petardi\" (explosives), provides collapsible fuel canister, moral support for the \"dig.\"\n\n<span class=\"hljs-section\">### 🏗️ External Reality: The \"Urban Renewal\" Project</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Initial Observation (Mr. I's Perspective)**</span>\n<span class=\"hljs-bullet\">    -</span> Construction starts subtly, expands, perceived as a \"monster.\"\n<span class=\"hljs-bullet\">    -</span> Dismissed as \"summer roadwork.\"\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Confirmation of City Involvement**</span>\n<span class=\"hljs-bullet\">    -</span> Overhears Ramiro (bar owner) mention \"bonifico.\"\n<span class=\"hljs-bullet\">    -</span> Mrs. Laura (neighbor) mentions receiving \"a lot of money.\"\n<span class=\"hljs-bullet\">    -</span> Ruben (neighbor) confirms receiving a \"check,\" selling his house.\n<span class=\"hljs-bullet\">    -</span> City officials visit Mr. I, offer \"rich compensation,\" threaten expropriation for \"progress.\"\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Key Information Overheard by Mr. I**</span>\n<span class=\"hljs-bullet\">    -</span> Workers discussing \"digging for years\" and \"drill is slow but unstoppable.\"\n<span class=\"hljs-bullet\">    -</span> Vigilessa confirming \"a lot of money involved\" and city's urgency.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Actual Project Nature (Revealed by Lawyer Siluri)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Goal:**</span> Construction of a new <span class=\"hljs-emphasis\">*metro station*</span>.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Incident Cause:**</span> Explosion of a <span class=\"hljs-emphasis\">*septic tank*</span> in Ruben's former garden.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Root Cause of Septic Tank Issue:**</span> A dog's head (Simba's, placed by Mr. I) obstructing the drain.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**The \"Precious Liquid\":**</span> Human organic waste.\n\n<span class=\"hljs-section\">### 🎭 Key Events &amp; Incidents</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**The Site Office \"Sabotage\" (Chapter 3)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Action:**</span> Mr. I places firecrackers in the construction office computer.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Outcome:**</span> Causes an explosion, burning the container; police investigate.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Simba's Demise &amp; Mrs. Laura's Death (Chapter 9)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Incident:**</span> Mr. I's escaped alligator turtle kills Simba. Mrs. Laura dies of shock upon seeing Simba's body.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Mr. I's Action:**</span> Conceals Simba's head in a sewer drain.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Outcome:**</span> Mr. I feels \"blessed\" by fate, no witnesses.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Taddeo's \"Secret\" (Chapter 14)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Discovery:**</span> Mr. I and Furio observe Mrs. Laura's son, Taddeo, dancing in a mini-pony costume in her basement.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Impact:**</span> Humorous distraction, reinforces their sense of moral superiority (Mr. I's homophobia, Furio's machismo).\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**The \"Oil Extraction\" Operation (Chapter 16-18)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Planning:**</span> Mr. I and Furio devise a simplistic plan to dig for \"petrol.\"\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Tools:**</span> Modified gardening picozza, rubber tube, funnel, collapsible canister.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Execution:**</span> Night-time digging in Ruben's former garden, hiding behind bulldozers.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Breakthrough:**</span> Picozza punctures something, foul-smelling liquid gushes out.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Outcome:**</span> They are submerged in human waste, unable to stop the flow or escape.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Rescue &amp; Hospitalization (Chapter 18)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Intervention:**</span> Construction workers rescue Mr. I and Furio from the waste.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Medical Outcome:**</span> Deemed mentally unstable, sedated, and hospitalized in an isolation room for decontamination.\n\n<span class=\"hljs-section\">### 💰 Project Resolution &amp; New Beginnings</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**The Lawyer's Intervention (Chapter 19)**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Agent:**</span> Lawyer Siluri, representing Scavi e Affini S.p.A.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Revelation:**</span> Explains the truth about the septic tank and metro project.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Offer:**</span> Two substantial checks for Mr. I and Furio's silence, to avoid delays and penalties.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Acceptance &amp; Financial Success**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Decision:**</span> Mr. I and Furio, initially enraged, accept the money upon seeing the zeros.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Outcome:**</span> They become \"rich,\" fulfilling their immediate financial aspirations without effort.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Mr. I's New Life (Chapter 20)**</span>\n<span class=\"hljs-bullet\">    -</span> Sells his old house to Scavi e Affini S.p.A.\n<span class=\"hljs-bullet\">    -</span> Buys a secluded, run-down \"rustic\" house in a degraded periphery.\n<span class=\"hljs-bullet\">    -</span> Reconciles with the past: Everyone won, he got money for nothing.\n<span class=\"hljs-bullet\">    -</span> New dreams: Imagines hunting birds from his window, continues to embrace delusion.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Furio's New Life (Chapter 20)**</span>\n<span class=\"hljs-bullet\">    -</span> Sells his shop to the company (to become a metro info point).\n<span class=\"hljs-bullet\">    -</span> Builds an even more elaborate underground bunker between marble quarries.\n<span class=\"hljs-bullet\">    -</span> New delusion: Convinced \"diamonds\" are forming in the quarries, waiting for them.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Ongoing Delusion**</span>\n<span class=\"hljs-bullet\">    -</span> Both characters continue to chase improbable fantasies and maintain their unique worldviews.\n<span class=\"hljs-bullet\">    -</span> Their \"project\" concludes with personal wealth achieved through misunderstanding and external intervention, reinforcing their belief in their \"ingenuity\" and \"luck.\"\n</code></pre>","children":[]},null)</script>

371,372"}},{"content":"Linee guida di risposta: soluzioni concrete, esempi commentati, confronti ragionati, best practices, spiegazione delle scelte, compromessi, incertezza esplicita","children":[],"payload":{"lines":"372,373"}},{"content":"Citazione del prompt adattato:\n<blockquote data-lines=\"374,393\">\n<p data-lines=\"374,375\">Agisci come un esperto programmatore con specializzazione nella progettazione di linguaggi dichiarativi e nell’automazione infrastrutturale.</p>\n<p data-lines=\"376,377\">Hai una profonda esperienza nei seguenti ambiti:</p>\n<ul data-lines=\"378,383\">\n<li data-lines=\"378,379\">Progettazione di <strong>DSL (Domain-Specific Languages)</strong>, con attenzione a leggibilità, modularità e idempotenza</li>\n<li data-lines=\"379,380\">Comprensione approfondita di linguaggi dichiarativi come <strong>Ansible</strong>, <strong>Terraform/OpenTofu</strong>, <strong>Pulumi (in HCL/YAML/JSON)</strong>, <strong>CloudFormation</strong>, ecc.</li>\n<li data-lines=\"380,381\">Sviluppo di sintassi e semantica per linguaggi configurazionali: gestione delle variabili, interpolazioni, flussi condizionali, moduli riutilizzabili</li>\n<li data-lines=\"381,383\">Design di linguaggi che si integrano con sistemi di provisioning, orchestrazione, o DevOps (es. CI/CD, GitOps)</li>\n</ul>\n<p data-lines=\"383,384\">Quando rispondi:</p>\n<ul data-lines=\"385,392\">\n<li data-lines=\"385,386\"><strong>Proponi soluzioni concrete</strong> per la progettazione di un nuovo linguaggio dichiarativo simile ad Ansible: struttura dei file, sintassi, semantica, modularità, esempi pratici</li>\n<li data-lines=\"386,387\">Fornisci <strong>esempi di codice chiari e commentati</strong>, anche in linguaggi esistenti (Ansible, HCL, YAML, ecc.) per ispirare o giustificare le scelte progettuali</li>\n<li data-lines=\"387,388\">Offri <strong>confronti ragionati</strong> tra diversi approcci sintattici (es. YAML vs HCL, flat vs nested structure, esplicito vs implicito)</li>\n<li data-lines=\"388,389\">Cita best practices per linguaggi dichiarativi, ad esempio: evitare logica imperativa, garantire idempotenza, favorire la leggibilità e la manutenzione</li>\n<li data-lines=\"389,390\">Se proponi una nuova sintassi o struttura, <strong>spiegane la logica</strong> dietro ogni scelta</li>\n<li data-lines=\"390,392\">Sii pragmatico: se ci sono compromessi tra potenza espressiva e semplicità, chiariscili</li>\n</ul>\n<p data-lines=\"392,393\">Quando non conosci una risposta con certezza, indicalo chiaramente e suggerisci come investigare ulteriormente (es. “questo dipende dal motore di esecuzione”, o “può essere utile guardare a come lo fa Pulumi”).</p>\n</blockquote>","children":[],"payload":{"lines":"373,393"}}],"payload":{"lines":"369,393"}},{"content":"TaskLang: bozza tecnica iniziale","children":[{"content":"Obiettivi: dichiarativo, espressivo e leggibile, idempotente, componibile/modulare, estensibile","children":[],"payload":{"lines":"394,395"}},{"content":"Nome provvisorio: TaskLang","children":[],"payload":{"lines":"395,396"}},{"content":"Struttura base <code>.task.yml</code><pre><code class=\"language-yaml\"><span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">\"Installazione e configurazione webserver\"</span>\n\n<span class=\"hljs-attr\">hosts:</span> <span class=\"hljs-string\">web_servers</span>\n<span class=\"hljs-attr\">vars:</span>\n  <span class=\"hljs-attr\">package_name:</span> <span class=\"hljs-string\">nginx</span>\n  <span class=\"hljs-attr\">config_file_path:</span> <span class=\"hljs-string\">/etc/nginx/nginx.conf</span>\n\n<span class=\"hljs-attr\">tasks:</span>\n  <span class=\"hljs-bullet\">-</span> <span class=\"hljs-attr\">name:</span> <span class=\"hljs-string\">Installare</span> <span class=\"hljs-string\">il</span> <span class=\"hljs-string\">pacchetto</span> {{ <span class=\"hljs-string\">package_name</span> }}\n    <span class=\"hljs-attr\">package:</span>\n      <span class=\"hljs-attr\">name:</span> <script>
(function(){
  function init(){
    if(!window.mm) return setTimeout(init,100);
    const mm=window.mm;
    const legend=document.createElement("div");
    legend.id="km-legend";
    legend.style.cssText="position:fixed;top:12px;left:12px;background:rgba(255,255,255,.95);padding:10px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);font:13px sans-serif;z-index:9999;display:none";
    legend.innerHTML="<b>Comandi</b><br>+ zoom in<br>- zoom out<br>0 adatta<br>? legenda";
    document.body.appendChild(legend);
    document.addEventListener("keydown",function(e){
      if(e.key==="+ "||e.key==="+"){mm.rescale(1.25);}
      else if(e.key==="-"){mm.rescale(1/1.25);}
      else if(e.key==="0"){mm.fit();}
      else if(e.key==="?"){legend.style.display=legend.style.display==="none"?"block":"none";}
    });
  }
  init();
})();
</script></body>

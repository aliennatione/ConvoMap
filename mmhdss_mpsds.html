<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17.2/dist/browser/index.js"></script><script src="https://cdn.jsdelivr.net/npm/markmap-toolbar@0.17.2/dist/index.js"></script><script>((r) => {

})</script><script>((getMarkmap, getOptions, root2, jsonOptions) => {

                "svg#mindmap",

              );
            })(() => window.markmap,null,{"content":"<pre><code class=\"language-markdown\"><span class=\"hljs-section\"># Multi-Platform Static/Dynamic Site (Free Stack Edition)</span>\n\n<span class=\"hljs-section\">## Project Overview</span>\n<span class=\"hljs-section\">### Goals</span>\n<span class=\"hljs-bullet\">-</span> Create a static + dynamic website using only free services\n<span class=\"hljs-bullet\">-</span> Utilize Supabase for authentication, relational database, and realtime capabilities\n<span class=\"hljs-bullet\">-</span> Implement FaunaDB for serverless APIs (GraphQL/FQL)\n<span class=\"hljs-bullet\">-</span> Host heavy multimedia files (video, audio, images, zip) on Archive.org\n<span class=\"hljs-bullet\">-</span> Leverage GitHub Pages + Cloudflare Pages for modern static hosting with custom domain and HTTPS\n\n<span class=\"hljs-section\">## Technology Stack</span>\n<span class=\"hljs-section\">### Frontend</span>\n<span class=\"hljs-bullet\">-</span> HTML/CSS/JS (Static responsive site)\n<span class=\"hljs-section\">### Hosting</span>\n<span class=\"hljs-bullet\">-</span> GitHub Pages + Cloudflare Pages\n<span class=\"hljs-bullet\">    -</span> Handles deployment\n<span class=\"hljs-bullet\">    -</span> Custom domain support\n<span class=\"hljs-bullet\">    -</span> CDN capabilities\n<span class=\"hljs-section\">### Backend</span>\n<span class=\"hljs-bullet\">-</span> Supabase\n<span class=\"hljs-bullet\">    -</span> Authentication (Auth)\n<span class=\"hljs-bullet\">    -</span> Relational Database (DB)\n<span class=\"hljs-bullet\">    -</span> Realtime functionalities\n<span class=\"hljs-bullet\">-</span> FaunaDB\n<span class=\"hljs-bullet\">    -</span> Serverless global database\n<span class=\"hljs-bullet\">    -</span> GraphQL/FQL API support\n<span class=\"hljs-section\">### Media Hosting</span>\n<span class=\"hljs-bullet\">-</span> Archive.org\n<span class=\"hljs-bullet\">    -</span> Designed for large video, audio, and zip files\n<span class=\"hljs-section\">### Proxy</span>\n<span class=\"hljs-bullet\">-</span> Cloudflare Workers (or Cloudflare Pages Functions)\n<span class=\"hljs-bullet\">    -</span> Media URL rewriting\n<span class=\"hljs-bullet\">    -</span> Manages CORS headers for media access\n\n<span class=\"hljs-section\">## Project Structure (Final)</span>\n<span class=\"hljs-section\">### Root Directory (`multi-platform-static-dynamic-site/`)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`README.md`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`LICENSE`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`.gitignore`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`.env.example`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`package.json`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`requirements.txt`</span>\n<span class=\"hljs-section\">### `public/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`index.html`</span> (Main HTML entry point)\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`assets/style.css`</span> (Global styles)\n<span class=\"hljs-section\">### `functions/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`media-proxy.js`</span> (Cloudflare Worker / Pages Function logic)\n<span class=\"hljs-section\">### `scripts/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`upload_to_archive.sh`</span> (Bash script for Archive.org uploads)\n<span class=\"hljs-section\">### `examples/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`embed-media.html`</span> (Example of media served from Archive.org)\n<span class=\"hljs-section\">### `tests/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`test-api-supabase.js`</span> (Supabase API connection test script)\n<span class=\"hljs-section\">### `workflows/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`deploy.yml`</span> (GitHub Action for CI/CD)\n<span class=\"hljs-section\">### `config/`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`supabase-config.js`</span> (Supabase client setup)\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`fauna-query-example.gql`</span> (Example GraphQL query for FaunaDB)\n\n<span class=\"hljs-section\">## Installation &amp; Setup</span>\n<span class=\"hljs-section\">### 1. Clone Project</span>\n<span class=\"hljs-bullet\">-</span> Command: <span class=\"hljs-code\">`git clone https://github.com/tuo-utente/multi-platform-static-dynamic-site.git`</span>\n<span class=\"hljs-bullet\">-</span> Command: <span class=\"hljs-code\">`cd multi-platform-static-dynamic-site`</span>\n<span class=\"hljs-section\">### 2. Install Dependencies</span>\n<span class=\"hljs-bullet\">-</span> Command (Node.js): <span class=\"hljs-code\">`npm install`</span>\n<span class=\"hljs-bullet\">-</span> Command (Python): <span class=\"hljs-code\">`pip install -r requirements.txt`</span>\n<span class=\"hljs-section\">### 3. Configure Environment Variables</span>\n<span class=\"hljs-bullet\">-</span> Decision: Copy example file for configuration\n<span class=\"hljs-bullet\">    -</span> Command: <span class=\"hljs-code\">`cp .env.example .env`</span>\n<span class=\"hljs-bullet\">-</span> Outcome: <span class=\"hljs-code\">`.env`</span> file created for sensitive keys\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`SUPABASE_URL=https://xyzcompany.supabase.co`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`SUPABASE_KEY=your-anon-public-key`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`FAUNA_SECRET=your-fauna-key`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`IA_ACCESS_KEY=your-archive-access`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`IA_SECRET_KEY=your-archive-secret`</span>\n<span class=\"hljs-section\">### 4. Configure Cloudflare Pages</span>\n<span class=\"hljs-bullet\">-</span> Action: Connect GitHub repository to Cloudflare Pages\n<span class=\"hljs-bullet\">-</span> Action: Set build output directory to <span class=\"hljs-code\">`public`</span>\n<span class=\"hljs-bullet\">-</span> Action: Configure Pages Functions directory to <span class=\"hljs-code\">`functions/`</span>\n<span class=\"hljs-section\">### 5. (Optional) Upload Media to Archive.org</span>\n<span class=\"hljs-bullet\">-</span> Command: <span class=\"hljs-code\">`bash scripts/upload_to_archive.sh video.mp4`</span>\n<span class=\"hljs-section\">### 6. Deploy GitHub Actions</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`workflows/deploy.yml`</span> configuration manages:\n<span class=\"hljs-bullet\">    -</span> Build process\n<span class=\"hljs-bullet\">    -</span> Deployment to Cloudflare Pages\n<span class=\"hljs-bullet\">    -</span> Uploading project snapshots to Archive.org\n\n<span class=\"hljs-section\">## Deployment</span>\n<span class=\"hljs-section\">### Method</span>\n<span class=\"hljs-bullet\">-</span> Automated pipeline: GitHub → Cloudflare Pages → Automatic HTTPS custom domain\n\n<span class=\"hljs-section\">## Testing</span>\n<span class=\"hljs-section\">### Supabase API Connection Test</span>\n<span class=\"hljs-bullet\">-</span> Command: <span class=\"hljs-code\">`node tests/test-api-supabase.js`</span>\n<span class=\"hljs-bullet\">-</span> Outcome: Verifies Supabase connection and data retrieval\n\n<span class=\"hljs-section\">## Documentation</span>\n<span class=\"hljs-section\">### Key Files &amp; Their Purpose</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`config/supabase-config.js`</span>: Contains Supabase client initialization and API keys.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`config/fauna-query-example.gql`</span>: Provides an example GraphQL query for FaunaDB.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`functions/media-proxy.js`</span>: Implements the Cloudflare Worker/Pages Function for media URL rewriting and CORS.\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-code\">`scripts/upload_to_archive.sh`</span>: A bash script for command-line uploads to Archive.org.\n\n<span class=\"hljs-section\">## Legal / Licensing</span>\n<span class=\"hljs-section\">### License</span>\n<span class=\"hljs-bullet\">-</span> MIT License\n<span class=\"hljs-section\">### Details</span>\n<span class=\"hljs-bullet\">-</span> Refer to the <span class=\"hljs-code\">`LICENSE`</span> file for full terms and conditions.\n\n<span class=\"hljs-section\">## Key File Contents &amp; Logic</span>\n<span class=\"hljs-section\">### `.gitignore`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Ignored Items:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`node_modules/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`.env`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`dist/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`.cache/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`.vscode/`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`__pycache__/`</span>, <span class=\"hljs-code\">`*.pyc`</span> (Python artifacts)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`*.zip`</span>, <span class=\"hljs-code\">`upload.log`</span> (Archive.org artifacts)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`.DS_Store`</span>, <span class=\"hljs-code\">`Thumbs.db`</span> (OS specific files)\n<span class=\"hljs-section\">### `public/index.html`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Core Structure:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;meta charset=\"UTF-8\" /&gt;`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/&gt;`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;title&gt;Multi-Platform Free Web App&lt;/title&gt;`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;link rel=\"stylesheet\" href=\"assets/style.css\"&gt;`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;h1&gt;Benvenuto nel tuo sito 100% gratuito!&lt;/h1&gt;`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Embedded Video Example:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;video controls width=\"600\"&gt;&lt;source src=\"https://archive.org/download/miosito-media/video.mp4\" type=\"video/mp4\"&gt;...&lt;/video&gt;`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Supabase Config Import:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`&lt;script type=\"module\" src=\"../config/supabase-config.js\"&gt;&lt;/script&gt;`</span>\n<span class=\"hljs-section\">### `functions/media-proxy.js` (Cloudflare Worker / Pages Function)</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**`onRequest` Function Logic:**</span>\n<span class=\"hljs-bullet\">    -</span> Extracts <span class=\"hljs-code\">`mediaPath`</span> by replacing <span class=\"hljs-code\">`/media/`</span> with <span class=\"hljs-code\">`/download/miosito-media/`</span> in the URL pathname.\n<span class=\"hljs-bullet\">    -</span> Constructs <span class=\"hljs-code\">`archiveUrl`</span>: <span class=\"hljs-code\">`` `</span>https://archive.org${mediaPath}<span class=\"hljs-code\">` `</span>`\n<span class=\"hljs-bullet\">    -</span> Fetches content from <span class=\"hljs-code\">`archiveUrl`</span>.\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-strong\">**Decision:**</span> Sets <span class=\"hljs-code\">`Access-Control-Allow-Origin: *`</span> header to enable CORS.\n<span class=\"hljs-section\">### `config/supabase-config.js`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Supabase Client Initialization:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`import { createClient } from '@supabase/supabase-js'`</span>\n<span class=\"hljs-bullet\">    -</span> Retrieves <span class=\"hljs-code\">`supabaseUrl`</span> and <span class=\"hljs-code\">`supabaseKey`</span> from <span class=\"hljs-code\">`import.meta.env`</span> (Vite environment variables).\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`export const supabase = createClient(supabaseUrl, supabaseKey)`</span>\n<span class=\"hljs-section\">### `config/fauna-query-example.gql`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Example GraphQL Query:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">```graphql\n      query GetPosts {\n        posts {\n          data {\n            title\n            content\n          }\n        }\n      }\n      ```</span>\n<span class=\"hljs-section\">### `scripts/upload<span class=\"hljs-emphasis\">_to_</span>archive.sh`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Bash Script Details:**</span>\n<span class=\"hljs-bullet\">    -</span> Takes <span class=\"hljs-code\">`FILE`</span> as the first argument.\n<span class=\"hljs-bullet\">    -</span> Generates a unique <span class=\"hljs-code\">`ID`</span>: <span class=\"hljs-code\">`miosito-$(date +%F-%H%M%S)`</span>\n<span class=\"hljs-bullet\">    -</span> Executes <span class=\"hljs-code\">`ia upload`</span> command with specified <span class=\"hljs-code\">`ID`</span> and <span class=\"hljs-code\">`FILE`</span>.\n<span class=\"hljs-bullet\">    -</span> Includes metadata: <span class=\"hljs-code\">`title`</span>, <span class=\"hljs-code\">`description`</span>, <span class=\"hljs-code\">`collection`</span>.\n<span class=\"hljs-section\">### `tests/test-api-supabase.js`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Supabase Connection Test Script:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`import { supabase } from '../config/supabase-config.js'`</span>\n<span class=\"hljs-bullet\">    -</span> Defines <span class=\"hljs-code\">`testConnection`</span> async function.\n<span class=\"hljs-bullet\">    -</span> Queries <span class=\"hljs-code\">`profiles`</span> table: <span class=\"hljs-code\">`await supabase.from('profiles').select('*')`</span>\n<span class=\"hljs-bullet\">    -</span> Logs success (<span class=\"hljs-code\">`Dati ricevuti:`</span>) or error (<span class=\"hljs-code\">`Errore Supabase:`</span>).\n<span class=\"hljs-section\">### `examples/embed-media.html`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**HTML Media Embedding Example:**</span>\n<span class=\"hljs-bullet\">    -</span> Contains a <span class=\"hljs-code\">`&lt;video&gt;`</span> tag with a hardcoded <span class=\"hljs-code\">`src`</span> pointing to <span class=\"hljs-code\">`https://archive.org/download/miosito-media/video.mp4`</span>.\n<span class=\"hljs-section\">### `requirements.txt`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Python Dependencies:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`internetarchive`</span> (for <span class=\"hljs-code\">`ia`</span> CLI tool used in <span class=\"hljs-code\">`upload_to_archive.sh`</span>)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`python-dotenv`</span> (for loading <span class=\"hljs-code\">`.env`</span> variables in Python scripts, if any)\n<span class=\"hljs-section\">### `package.json`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Project Metadata:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`name: \"multi-platform-site\"`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`version: \"1.0.0\"`</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`description: \"Sito statico/dinamico gratis con Supabase, Fauna, Archive, GitHub, Cloudflare\"`</span>\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**NPM Scripts:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`dev: \"vite\"`</span> (Starts development server)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`build: \"vite build\"`</span> (Builds the project for production)\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`test: \"node tests/test-api-supabase.js\"`</span> (Runs the Supabase API test)\n<span class=\"hljs-bullet\">-</span> <span class=\"hljs-strong\">**Dependencies:**</span>\n<span class=\"hljs-bullet\">    -</span> <span class=\"hljs-code\">`@supabase/supabase-js: \"^2.0.0\"`</span>\n</code></pre>","children":[]},null)</script>
